    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 区域地址
        tip: 目标区域地址，如 A1:D2
      - key: merge_type
        title: 操作类型
        tip: 选择合并或拆分单元格
    outputList:
      - key: merge_cells_result
        title: 操作结果保存至
        tip: 输出是否操作成功
  WPS.set_format:
    title: 设置单元格格式(WPS)
    comment: 设置工作表(@{sheet_name})区域(@{range_address})的格式(@{format_options})，输出为(@{set_format_result})
    icon: excel-set-cell-format
    helpManual: '设置WPS在线表格单元格格式，格式选项为字典，支持的键: font_bold加粗/font_italic斜体/font_size字号/font_name字体/font_color字体颜色/bg_color背景色/h_align水平对齐/v_align垂直对齐/wrap_text自动换行/number_format数字格式。示例: {"bg_color":"#FFFF00","font_bold":true,"h_align":"center"}'
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 区域地址
        tip: 目标区域地址，如 A1:D2
      - key: format_options
        title: 格式选项
        tip: '格式字典，如 {"bg_color":"#FFFF00","font_bold":true,"h_align":"center"}'
    outputList:
      - key: set_format_result
        title: 设置结果保存至
        tip: 输出是否设置成功
  WPS.get_color:
    title: 获取单元格颜色(WPS)
    comment: 获取工作表(@{sheet_name})中单元格(@{range_address})的颜色，输出为(@{color_result})
    icon: excel-get-cell-color
    helpManual: 获取WPS在线表格目标单元格的背景色与字体颜色，返回字典如{"bg_color":"#FFFFFF","font_color":"#000000"}
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 单元格地址
        tip: 目标单元格地址，如 A1
    outputList:
      - key: color_result
        title: 颜色结果保存至
        tip: '输出字典，如 {"bg_color":"#FFFFFF","font_color":"#000000"}'
  WPS.formula:
    title: 读写公式(WPS)
    comment: 对工作表(@{sheet_name})的(@{range_address})执行(@{formula_mode})公式操作，输出为(@{formula_result})
    icon: excel-insert-formula
    helpManual: 读取或写入WPS在线表格单元格公式。读取时返回区域左上角单元格的公式文本（如"=A1+B1"）；写入时对左上角单元格写入公式，需以=开头
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 单元格地址
        tip: 目标单元格地址，如 A2
      - key: formula_mode
        title: 操作模式
        tip: 选择读取公式或写入公式
      - key: formula_text
        title: 公式内容
        tip: '写入模式时填写，以=开头，如 =A1+B1'
    outputList:
      - key: formula_result
        title: 公式结果保存至
        tip: 读取时输出公式文本，写入时输出写入后的公式
  WPS.save_workbook:
    title: 保存文档(WPS)
    comment: 保存WPS在线表格当前工作簿的全部改动，输出为(@{save_workbook_result})
    icon: excel-save-file
    helpManual: 保存WPS在线表格当前工作簿的全部改动
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
    outputList:
      - key: save_workbook_result
        title: 保存结果保存至
        tip: 输出是否保存成功
  WPS.rename_sheet:
    title: 重命名工作表(WPS)
    comment: 将工作表(@{sheet_name})重命名为(@{new_sheet_name})，输出为(@{rename_sheet_result})
    icon: excel-rename-sheet
    helpManual: 重命名WPS在线表格的指定工作表
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 待重命名的工作表名称
      - key: new_sheet_name
        title: 新工作表名称
        tip: 重命名后的工作表名称
    outputList:
      - key: rename_sheet_result
        title: 重命名结果保存至
        tip: 输出重命名后的工作表名称
  WPS.move_sheet:
    title: 移动工作表(WPS)
    comment: 将工作表(@{sheet_name})移动到第(@{position})个位置，输出为(@{move_sheet_result})
    icon: excel-move-sheet
    helpManual: 移动WPS在线表格的指定工作表到目标位置（从1开始）
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 待移动的工作表名称
      - key: position
        title: 目标位置
        tip: 移动到的位置序号，从1开始
    outputList:
      - key: move_sheet_result
        title: 移动结果保存至
        tip: 输出是否移动成功
  WPS.auto_fit:
    title: 行列自适应(WPS)
    comment: 自适应工作表(@{sheet_name})区域(@{range_address})的(@{fit_type})，输出为(@{auto_fit_result})
    icon: excel-set-row-height
    helpManual: 自动调整WPS在线表格的行高/列宽以达到最佳匹配，区域为空时对整个已使用区域生效
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 区域地址
        tip: '为空时对整个已使用区域生效；如 A1:D10'
      - key: fit_type
        title: 自适应类型
        tip: 选择调整行高、列宽或全部
    outputList:
      - key: auto_fit_result
        title: 自适应结果保存至
        tip: 输出是否调整成功
  WPS.get_file_info:
    title: 获取文档信息(WPS)
    comment: 获取当前WPS在线表格的文档与用户信息，输出为(@{file_info_result})
    icon: get-file-info
    helpManual: 获取WPS在线表格当前文档信息与用户信息，返回字典，包含file（文档信息）与user（当前用户信息）
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
    outputList:
      - key: file_info_result
        title: 文档信息保存至
        tip: 输出包含文档信息与用户信息的字典
  WPS.calc_function:
    title: 工作表函数计算(WPS)
    comment: 对工作表(@{sheet_name})区域(@{range_address})执行(@{func_name})计算，输出为(@{calc_result})
    icon: math-calculation
    helpManual: 对WPS在线表格指定区域执行聚合计算，支持求和/平均/最小/最大/第k大/第k小，区域为空时对整个已使用区域计算
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 区域地址
        tip: '为空时对整个已使用区域计算；如 B2:B100'
      - key: func_name
        title: 计算函数
        tip: 选择计算函数
      - key: k
        title: 第k个(k值)
        tip: 选择第k大/第k小时填写，默认1
    outputList:
      - key: calc_result
        title: 计算结果保存至
        tip: 输出计算结果数值
options:
  TargetType:
    - value: row
      label: 行
    - value: column
      label: 列
  OpType:
    - value: row
      label: 行
    - value: column
      label: 列
    - value: cell
      label: 单元格
  ClearType:
    - value: contents
      label: 仅内容
    - value: formats
      label: 仅格式
    - value: all
      label: 内容和格式
  MergeType:
    - value: merge
      label: 合并
    - value: unmerge
      label: 拆分
  FitType:
    - value: row
      label: 行高
    - value: column
      label: 列宽
    - value: both
      label: 全部
  FormulaMode:
    - value: get
      label: 读取
    - value: set
      label: 写入
  FuncName:
    - value: sum
      label: 求和
    - value: average
      label: 平均
    - value: min
      label: 最小值
    - value: max
      label: 最大值
    - value: large
      label: 第k大
    - value: small
      label: 第k小
