atomic:
  WPS.create_client:
    title: 创建WPS表格连接
    comment: 建立与WPS在线表格AirScript脚本(@{hook_url})的连接，输出为(@{wps_client})
    icon: excel-open-file
    helpManual: |-
      {"guide": {"title": "WPS 在线表格 · 连接设置指南", "steps": ["打开目标 WPS 在线表格（金山文档）", "顶部菜单依次点击：效率 → 高级开发 → AirScript 脚本编辑器", "在左侧选择「文档共享脚本」，点击右上侧下拉箭头展开，选择「AirScript 1.0」", "新建（或打开已有）脚本，全选编辑器内容后粘贴下方脚本", "点击上方「保存」按钮", "点击左侧「三个点」菜单 → 「复制脚本 Webhook」，将地址填入本指令的「Webhook地址」", "点击上方「盾牌」按钮 → 复制令牌，填入本指令的「AirScript令牌」", "提示：以后更新脚本时，全选替换后保存即可，Webhook 地址与令牌保持不变"], "script": "/*\n * WPS AirScript 1.0 script entry.\n *\n * Supported Context.argv fields:\n * - action: read | write | count | first_empty | get_image | insert_image | get_hyperlink | list_sheets | create_sheet | delete_sheet\n * - sheet_name: target worksheet name\n * - range_address: target row / column / range address\n * - write_value: value to write\n * - image_data: image URL or data URI for insert_image\n * - target_type: row | column for count / first_empty\n * - new_sheet_names: target sheet names for create_sheet\n */\n\nfunction getArgValue(key, defaultValue) {\n    if (typeof Context !== \"undefined\" && Context && Context.argv && typeof Context.argv[key] !== \"undefined\") {\n        return Context.argv[key]\n    }\n\n    if (typeof Context !== \"undefined\" && Context && typeof Context[key] !== \"undefined\") {\n        return Context[key]\n    }\n\n    return defaultValue\n}\n\nfunction getParams() {\n    let value = getArgValue(\"new_sheet_names\", [])\n    let newSheetNames\n\n    if (Array.isArray(value)) {\n        newSheetNames = value\n    } else if (typeof value === \"string\" && value.length > 0) {\n        newSheetNames = [value]\n    } else {\n        newSheetNames = []\n    }\n\n    return {\n        action: String(getArgValue(\"action\", \"read\")),\n        sheetName: String(getArgValue(\"sheet_name\", \"\")),\n        rangeAddress: String(getArgValue(\"range_address\", \"\")),\n        writeValue: getArgValue(\"write_value\", \"\"),\n        imageData: String(getArgValue(\"image_data\", \"\")),\n        targetType: String(getArgValue(\"target_type\", \"row\")).toLowerCase(),\n        newSheetNames: newSheetNames\n    }\n}\n\nfunction getAllSheets() {\n    if (typeof Sheets !== \"undefined\" && Sheets && Sheets.Count > 0) {\n        return Sheets\n    }\n    return Application.Sheets\n}\n\nfunction getWorksheet(sheetName) {\n    // Webhook 环境下 Application.Sheets.Item(名称) 可能返回 null，\n    // 改为遍历全局 Sheets 逐个比对名称（与 list_sheets 实测可用的方式一致）。\n    let sheets = getAllSheets()\n\n    for (let i = 1; i <= sheets.Count; i++) {\n        let item = sheets.Item(i)\n        if (item && item.Name === sheetName) {\n            return item\n        }\n    }\n\n    let available = []\n    for (let j = 1; j <= sheets.Count; j++) {\n        available.push(sheets.Item(j).Name)\n    }\n    throw new Error(\"工作表[\" + sheetName + \"]不存在，当前工作簿可用工作表：\" + available.join(\"、\"))\n}\n\nfunction getColumnLetters(columnNumber) {\n    let result = \"\"\n    let current = Number(columnNumber)\n    let remainder\n\n    while (current > 0) {\n        remainder = (current - 1) % 26\n        result = String.fromCharCode(65 + remainder) + result\n        current = Math.floor((current - 1) / 26)\n    }\n\n    return result\n}\n\nfunction getReadAddress(curWorksheet, rangeAddress) {\n    // 统一把各种输入（\"\"/行号/列字母/A1:B2）换算成显式区域地址\n    if (!rangeAddress) {\n        let usedRange = curWorksheet.UsedRange\n        return getColumnLetters(usedRange.Column) + usedRange.Row + \":\" + getColumnLetters(usedRange.ColumnEnd) + usedRange.RowEnd\n    }\n\n    if (/^\\d+$/.test(rangeAddress)) {\n        let usedRange = curWorksheet.UsedRange\n        let lastColumnLetter = getColumnLetters(usedRange.ColumnEnd)\n        return \"A\" + rangeAddress + \":\" + lastColumnLetter + rangeAddress\n    }\n\n    if (/^[A-Za-z]+$/.test(rangeAddress)) {\n        let usedRange = curWorksheet.UsedRange\n        let columnLetter = String(rangeAddress).toUpperCase()\n        return columnLetter + usedRange.Row + \":\" + columnLetter + usedRange.RowEnd\n    }\n\n    return rangeAddress\n}\n\nfunction readRangeSafe(curWorksheet, address) {\n    let rangeObj = curWorksheet.Range(address)\n    let startRow = rangeObj.Row\n    let startColumn = rangeObj.Column\n    let endRow = startRow + rangeObj.Rows.Count - 1\n    let endColumn = startColumn + rangeObj.Columns.Count - 1\n\n    try {\n        return rangeObj.Value2\n    } catch (e) {\n        // 含特殊单元格（如脱敏列）时批量取值会触发内核错误，降级为逐格读取\n        if (startRow === endRow && startColumn === endColumn) {\n            return null\n        }\n\n        let matrix = []\n        for (let r = startRow; r <= endRow; r++) {\n            let rowValues = []\n            for (let c = startColumn; c <= endColumn; c++) {\n                try {\n                    rowValues.push(curWorksheet.Range(getColumnLetters(c) + r).Value2)\n                } catch (cellError) {\n                    rowValues.push(null)\n                }\n            }\n            matrix.push(rowValues)\n        }\n        return matrix\n    }\n}\n\nfunction readSheetData(sheetName, rangeAddress) {\n    let curWorksheet = getWorksheet(sheetName)\n    return readRangeSafe(curWorksheet, getReadAddress(curWorksheet, rangeAddress))\n}\n\nfunction normalizeWriteMatrix(writeValue) {\n    if (!Array.isArray(writeValue)) {\n        return null\n    }\n\n    if (writeValue.length === 0) {\n        return [[]]\n    }\n\n    if (Array.isArray(writeValue[0])) {\n        return writeValue\n    }\n\n    return [writeValue]\n}\n\nfunction writeSheetData(sheetName, rangeAddress, writeValue) {\n    let curWorksheet = getWorksheet(sheetName)\n    let startAddress = rangeAddress || \"A1\"\n    let startRange = curWorksheet.Range(startAddress)\n    let matrix = normalizeWriteMatrix(writeValue)\n    let targetRange\n    let rowCount\n    let columnCount\n\n    if (matrix === null) {\n        startRange.Value2 = writeValue\n        return startRange.Value2\n    }\n\n    rowCount = matrix.length\n    columnCount = matrix[0] ? matrix[0].length : 0\n\n    if (rowCount === 0 || columnCount === 0) {\n        startRange.Value2 = \"\"\n        return startRange.Value2\n    }\n\n    targetRange = startRange.Resize(rowCount, columnCount)\n    targetRange.Value2 = matrix\n    return targetRange.Value2\n}\n\nfunction getUsedRangeInfo(sheetName) {\n    let curWorksheet = getWorksheet(sheetName)\n    let usedRange = curWorksheet.UsedRange\n\n    return {\n        usedRange: usedRange,\n        rowStart: usedRange.Row,\n        rowEnd: usedRange.RowEnd,\n        columnStart: usedRange.Column,\n        columnEnd: usedRange.ColumnEnd,\n        rowCount: usedRange.RowEnd - usedRange.Row + 1,\n        columnCount: usedRange.ColumnEnd - usedRange.Column + 1\n    }\n}\n\nfunction getCountValue(sheetName, targetType) {\n    let info = getUsedRangeInfo(sheetName)\n\n    if (targetType === \"column\") {\n        return info.columnCount\n    }\n\n    return info.rowCount\n}\n\nfunction getFirstEmptyValue(sheetName, targetType) {\n    let info = getUsedRangeInfo(sheetName)\n\n    if (targetType === \"column\") {\n        return getColumnLetters(info.columnEnd + 1)\n    }\n\n    return info.rowEnd + 1\n}\n\nfunction getEmbeddedImage(sheetName, rangeAddress) {\n    let curWorksheet = getWorksheet(sheetName)\n    let targetAddress = rangeAddress || \"A1\"\n\n    curWorksheet.Range(targetAddress).Select()\n    return curWorksheet.Shapes.GetActiveShapeImg()\n}\n\nfunction insertImageToCell(sheetName, rangeAddress, imageData) {\n    let curWorksheet = getWorksheet(sheetName)\n    let targetAddress = rangeAddress || \"A1\"\n    let targetRange = curWorksheet.Range(targetAddress)\n\n    targetRange.InsertImage(imageData)\n    return true\n}\n\nfunction getCellHyperlink(sheetName, rangeAddress) {\n    let curWorksheet = getWorksheet(sheetName)\n    let targetAddress = rangeAddress || \"A1\"\n    let targetRange = curWorksheet.Range(targetAddress)\n\n    if (targetRange.Hyperlinks.Count > 0) {\n        return targetRange.Hyperlinks(1).Address\n    }\n\n    return \"\"\n}\n\nfunction listSheetNames() {\n    let list = []\n\n    for (let i = 1; i <= Sheets.Count; i++) {\n        list.push(Sheets(i).Name)\n    }\n\n    return list\n}\n\nfunction createSheets(newSheetNames) {\n    let createdNames = []\n    let newSheet\n    let curName\n    let finalName\n    let exists\n\n    for (let i = 0; i < newSheetNames.length; i++) {\n        curName = newSheetNames[i]\n        newSheet = Sheets.Add()\n        finalName = newSheet.Name\n\n        if (typeof curName !== \"undefined\" && String(curName).length > 0) {\n            exists = false\n            for (let j = 1; j <= Sheets.Count; j++) {\n                if (Sheets(j).Name === curName && Sheets(j).Index !== newSheet.Index) {\n                    exists = true\n                }\n            }\n\n            if (!exists) {\n                newSheet.Name = curName\n            } else {\n                newSheet.Name = curName + \"_\" + Sheets.Count\n            }\n\n            finalName = newSheet.Name\n        }\n\n        createdNames.push(finalName)\n    }\n\n    return createdNames\n}\n\nfunction deleteSheetByName(sheetName) {\n    let targetSheet = getWorksheet(sheetName)\n    targetSheet.Delete()\n    return true\n}\n\nfunction Macro() {\n    let params = getParams()\n\n    if (params.action === \"write\") {\n        return writeSheetData(params.sheetName, params.rangeAddress, params.writeValue)\n    }\n\n    if (params.action === \"count\") {\n        return getCountValue(params.sheetName, params.targetType)\n    }\n\n    if (params.action === \"first_empty\") {\n        return getFirstEmptyValue(params.sheetName, params.targetType)\n    }\n\n    if (params.action === \"get_image\") {\n        return getEmbeddedImage(params.sheetName, params.rangeAddress)\n    }\n\n    if (params.action === \"insert_image\") {\n        return insertImageToCell(params.sheetName, params.rangeAddress, params.imageData)\n    }\n\n    if (params.action === \"get_hyperlink\") {\n        return getCellHyperlink(params.sheetName, params.rangeAddress)\n    }\n\n    if (params.action === \"list_sheets\") {\n        return listSheetNames()\n    }\n\n    if (params.action === \"create_sheet\") {\n        return createSheets(params.newSheetNames)\n    }\n\n    if (params.action === \"delete_sheet\") {\n        return deleteSheetByName(params.sheetName)\n    }\n\n    return readSheetData(params.sheetName, params.rangeAddress)\n}\n\nlet result = Macro()\nconsole.log(result)\nreturn result"}}
    inputList:
      - key: hook_url
        title: Webhook地址
        tip: WPS在线表格AirScript脚本的Webhook地址，以http开头
      - key: token
        title: AirScript令牌
        tip: WPS AirScript Webhook生成的AirScript-Token
      - key: time_out
        title: 超时时间(秒)
        tip: 请求超时时间，默认30秒
    outputList:
      - key: wps_client
        title: 保存WPS连接对象至
        tip: 将创建的WPS在线表格连接对象保存至指定变量中
  WPS.read_range:
    title: 读取区域数据(WPS)
    comment: 读取工作表(@{sheet_name})中区域(@{range_address})的数据，输出为(@{read_result})
    icon: excel-read-content
    helpManual: 读取WPS在线表格指定工作表的区域数据。区域为空读取整表，"3"读取第3行，"A"读取A列，"A2:D5"读取指定区域
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 区域地址
        tip: '为空读取整表；"3"读取第3行；"A"读取A列；"A2:D5"读取指定区域'
    outputList:
      - key: read_result
        title: 读取结果保存至
        tip: 输出二维列表形式的数据
  WPS.write_range:
    title: 写入数据(WPS)
    comment: 将数据(@{write_value})写入工作表(@{sheet_name})的(@{range_address})起始位置，输出为(@{write_result})
    icon: excel-write-file
    helpManual: 向WPS在线表格写入数据，支持标量或二维列表，二维列表如[["a","b"],["c","d"]]
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 起始单元格地址
        tip: 写入起始位置，如 A1
      - key: write_value
        title: 写入内容
        tip: 标量或二维列表，二维列表如[["a","b"],["c","d"]]
    outputList:
      - key: write_result
        title: 写入结果保存至
        tip: 输出写入后的数据
  WPS.get_count:
    title: 获取总行数/列数(WPS)
    comment: 获取工作表(@{sheet_name})的(@{target_type})总数，输出为(@{count_result})
    icon: excel-get-row-count
    helpManual: 获取WPS在线表格已使用区域的总行数或总列数
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: target_type
        title: 统计对象
        tip: 选择统计行数或列数
    outputList:
      - key: count_result
        title: 总数保存至
        tip: 输出总行数或总列数
  WPS.get_first_available:
    title: 获取首个空行/空列(WPS)
    comment: 获取工作表(@{sheet_name})的首个空(@{target_type})，输出为(@{first_available_result})
    icon: excel-get-first-available-row
    helpManual: 获取WPS在线表格已使用区域后的首个可用行号或列字母
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: target_type
        title: 查找对象
        tip: 选择查找空行或空列
    outputList:
      - key: first_available_result
        title: 结果保存至
        tip: 空行输出行号，空列输出大写列字母
  WPS.get_image:
    title: 获取单元格图片(WPS)
    comment: 获取工作表(@{sheet_name})中单元格(@{range_address})的图片，输出为(@{image_result})
    icon: excel-insert-image
    helpManual: 获取WPS在线表格目标单元格关联的图片数据
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 单元格地址
        tip: 目标单元格地址，如 A1
    outputList:
      - key: image_result
        title: 图片数据保存至
        tip: 输出单元格关联的图片数据
  WPS.insert_image:
    title: 插入图片(WPS)
    comment: 将图片(@{image_source})插入工作表(@{sheet_name})的(@{range_address})位置，输出为(@{insert_image_result})
    icon: excel-insert-image
    helpManual: 向WPS在线表格指定单元格插入图片，图片来源支持本地文件路径或http/https图片URL
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 单元格地址
        tip: 插入位置，如 E1
      - key: image_source
        title: 图片来源
        tip: 本地图片文件路径，或http/https图片URL
    outputList:
      - key: insert_image_result
        title: 插入结果保存至
        tip: 输出是否插入成功
  WPS.get_hyperlink:
    title: 获取单元格超链接(WPS)
    comment: 获取工作表(@{sheet_name})中单元格(@{range_address})的超链接地址，输出为(@{hyperlink_result})
    icon: word-insert-hyperlink
    helpManual: 获取WPS在线表格目标单元格的超链接地址，无超链接时返回空字符串
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 目标工作表名称，如 Sheet1
      - key: range_address
        title: 单元格地址
        tip: 目标单元格地址，如 A1
    outputList:
      - key: hyperlink_result
        title: 超链接保存至
        tip: 输出超链接地址字符串
  WPS.list_sheets:
    title: 获取工作表列表(WPS)
    comment: 获取当前工作簿的所有工作表名称，输出为(@{sheet_names})
    icon: excel-get-sheet-names
    helpManual: 获取WPS在线表格当前工作簿中的所有工作表名称列表
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
    outputList:
      - key: sheet_names
        title: 工作表列表保存至
        tip: 输出所有工作表名称，数据类型为列表
  WPS.create_sheet:
    title: 创建工作表(WPS)
    comment: 在当前工作簿创建工作表(@{new_sheet_names})，输出为(@{created_sheets})
    icon: add-excel-worksheet
    helpManual: 在WPS在线表格当前工作簿中创建一个或多个工作表，传入名称列表如["Sheet2","Sheet3"]
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: new_sheet_names
        title: 新工作表名称列表
        tip: '工作表名称列表，如 ["Sheet2","Sheet3"]'
    outputList:
      - key: created_sheets
        title: 创建结果保存至
        tip: 输出实际创建的工作表名称列表
  WPS.delete_sheet:
    title: 删除工作表(WPS)
    comment: 删除工作表(@{sheet_name})，输出为(@{delete_sheet_result})
    icon: excel-delete-sheet
    helpManual: 删除WPS在线表格当前工作簿中的指定工作表
    inputList:
      - key: wps_client
        title: WPS连接对象
        tip: 已创建的WPS在线表格连接对象
      - key: sheet_name
        title: 工作表名称
        tip: 待删除的工作表名称
    outputList:
      - key: delete_sheet_result
        title: 删除结果保存至
        tip: 输出是否删除成功
options:
  TargetType:
    - value: row
      label: 行
    - value: column
      label: 列
