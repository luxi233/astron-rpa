        tip: 每项包含name、value、domain、path等字段
  BrowserSoftware.remove_cookie:
    title: 移除Cookie
    comment: >-
      移除浏览器对象 @{browser_obj} 中 @{url} 的名称为 @{cookie_name} 的Cookie，
      可按域名 @{cookie_domain} 、路径 @{cookie_path} 精准筛选
    icon: remove
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要移除Cookie的浏览器对象
      - key: url
        title: 目标url
        tip: ''
      - key: cookie_name
        title: cookie名称
        tip: 要移除的cookie名称（必填）
      - key: cookie_domain
        title: cookie域名
        tip: 按域名精准匹配，留空则不限制域名
      - key: cookie_path
        title: cookie路径
        tip: 按路径筛选，留空则不做限制
      - key: page_timeout
        title: 等待页面加载时间（秒）
        tip: 超过该时间停止等待
    outputList: []
  BrowserSoftware.get_scroll_position:
    title: 获取滚动条位置
    comment: 获取浏览器对象 @{browser_obj} 当前网页@{direction}滚动条的@{position}，输出至 @{scroll_position}
    icon: mouse-scroll-webpage
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要获取滚动条位置的浏览器对象
      - key: direction
        title: 滚动条方向
        tip: 选择横向或纵向滚动条
      - key: position
        title: 位置类型
        tip: 当前位置为已滚动的像素值，底部位置为滚动到底部时的像素值
    outputList:
      - key: scroll_position
        title: 滚动条位置
        tip: 单位为像素
  BrowserSoftware.get_web_info:
    title: 获取网页信息
    comment: 获取浏览器对象 @{browser_obj} 当前网页的@{info_type}，输出至 @{web_info}
    icon: info
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要获取网页信息的浏览器对象
      - key: info_type
        title: 信息类型
        tip: 选择要获取的网页信息类型
    outputList:
      - key: web_info
        title: 网页信息
        tip: ''
  BrowserSoftware.start_network_monitor:
    title: 开始监听网页请求
    comment: 开始监听浏览器对象 @{browser_obj} 的网络请求，可按URL正则 @{url_filter} 过滤
    icon: http-request
    helpManual: 开始监听后，网页发出的HTTP请求会被记录，配合【获取网页监听结果】指令可提取请求的URL、方法、状态码、响应内容等信息
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要监听网络请求的浏览器对象
      - key: url_filter
        title: URL过滤（正则）
        tip: 仅记录URL匹配该正则表达式的请求，留空则记录全部请求
    outputList: []
  BrowserSoftware.get_network_data:
    title: 获取网页监听结果
    comment: 获取浏览器对象 @{browser_obj} 的网络请求监听结果，输出至 @{request_list}
    icon: data-scraping-web
    helpManual: 返回开始监听后捕获的请求列表，每项包含url、method、status、resourceType、responseBody、responseHeaders等字段，获取后默认清空已记录的数据
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要获取监听结果的浏览器对象
      - key: url_filter
        title: URL过滤（正则）
        tip: 仅返回URL匹配该正则表达式的请求，留空则返回全部
      - key: resource_type
        title: 资源类型过滤
        tip: 如Document、XHR、Fetch、Script、Stylesheet、Image、Media、Font、WebSocket、Other，留空则不做限制
      - key: clear
        title: 获取后清空记录
        tip: 勾选后获取本次结果时清空已记录的请求数据
    outputList:
      - key: request_list
        title: 请求列表
        tip: 每项包含url、method、status、resourceType、responseBody等字段
  BrowserSoftware.stop_network_monitor:
    title: 停止监听网页请求
    comment: 停止监听浏览器对象 @{browser_obj} 的网络请求
    icon: http-request
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要停止监听的浏览器对象
    outputList: []
  BrowserSoftware.set_dialog_handler:
    title: 自动处理网页弹框
    comment: >-
      开启后浏览器对象 @{browser_obj} 中的alert/confirm/prompt弹框将自动点击@{button}，prompt弹框自动输入
      @{prompt_text}
    icon: message-dialog
    helpManual: 开启自动处理后，网页原生的警告框、确认框、输入框不再阻塞流程，由插件自动代替人工点击按钮；关闭后恢复浏览器默认行为
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要自动处理弹框的浏览器对象
      - key: enable
        title: 开启自动处理
        tip: 开启后弹框自动处理，关闭后恢复默认行为
      - key: button
        title: 自动点击按钮
        tip: 弹框出现时自动点击确定或取消
      - key: prompt_text
        title: prompt输入内容
        tip: prompt弹框出现时自动输入的文本内容
    outputList: []
  BrowserSoftware.get_dialog_text:
    title: 提取网页对话框内容
    comment: 提取浏览器对象 @{browser_obj} 中已捕获的网页对话框内容，输出至 @{dialog_list}
    icon: message
    helpManual: 返回自动处理弹框开启期间捕获的对话框记录列表，每项包含类型（alert/confirm/prompt）、消息内容和输入内容
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要提取对话框内容的浏览器对象
      - key: clear
        title: 获取后清空记录
        tip: 勾选后获取本次结果时清空已捕获的对话框记录
    outputList:
      - key: dialog_list
        title: 对话框内容列表
        tip: 每项包含type、message、promptText字段
  BrowserSoftware.http_request:
    title: 通过网页发送HTTP请求
    comment: 在浏览器对象 @{browser_obj} 中向URL(@{url})发送(@{request_type})请求，输出至 @{response_data}
    icon: http-request
    helpManual: 借助指定网页的登录态(Cookie)发送HTTP请求，适用于需要网页登录认证的接口；请求在网页上下文中执行，自动携带该站点的登录Cookie
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择已打开并完成登录的浏览器对象
      - key: url
        title: URL
        tip: 请求地址，建议与网页同域以携带登录Cookie
      - key: request_type
        title: 请求类型
        tip: GET/POST/PUT/PATCH/DELETE/HEAD
      - key: headers
        title: 请求头
        tip: JSON格式的请求头字符串
      - key: body
        title: 请求体
        tip: POST/PUT/PATCH/DELETE时的请求体内容
      - key: time_out
        title: 超时时间
        tip: 请求超时时间（秒）
    outputList:
      - key: response_data
        title: 响应结果保存至
        tip: 包含status(状态码)、headers(响应头)、body(响应体)的字典
  Assert.assert_element:
    title: 元素断言
    comment: 断言网页元素出现，等待(@{wait_time})秒，失败时中断流程
    icon: browser-check
    helpManual: 等待网页元素出现，超时未出现时抛出异常并中断流程；常用于流程关键节点校验页面加载状态
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: element_data
        title: 网页元素
        tip: 选择待断言的网页元素
      - key: wait_time
        title: 等待时间(秒)
        tip: 等待元素出现的超时时间
      - key: error_message
        title: 自定义错误信息
        tip: 断言失败时抛出的错误信息(不填使用默认信息)
  BrowserElement.wait_any_element:
    title: 等待任意一个元素出现（web）
    comment: 在浏览器对象 @{browser_obj} 中等待元素(@{element_1}/@{element_2}/@{element_3}/@{element_4}/@{element_5})任意一个出现，最长等待 @{element_timeout} 秒，命中名称保存至 @{hit_element_name}
    icon: wait-element-web
    helpManual: 同时等待多个网页元素，任意一个出现即返回并输出其名称；超时返回false，常用于分支页面(如弹窗/登录页/首页)的场景判断
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: element_1
        title: 元素1拾取
        tip: 拾取第1个候选元素
      - key: name_1
        title: 元素1名称
        tip: 元素1出现时输出的名称(默认"元素1")
      - key: element_2
        title: 元素2拾取
        tip: 拾取第2个候选元素(可选)
      - key: name_2
        title: 元素2名称
        tip: 元素2出现时输出的名称(默认"元素2")
      - key: element_3
        title: 元素3拾取
        tip: 拾取第3个候选元素(可选)
      - key: name_3
        title: 元素3名称
        tip: 元素3出现时输出的名称(默认"元素3")
      - key: element_4
        title: 元素4拾取
        tip: 拾取第4个候选元素(可选)
      - key: name_4
        title: 元素4名称
        tip: 元素4出现时输出的名称(默认"元素4")
      - key: element_5
        title: 元素5拾取
        tip: 拾取第5个候选元素(可选)
      - key: name_5
        title: 元素5名称
        tip: 元素5出现时输出的名称(默认"元素5")
      - key: element_timeout
        title: 等待时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: hit_element_name
        title: 命中元素名称保存至
        tip: 最先出现的元素名称，超时为空字符串
      - key: wait_result
        title: 等待结果保存至
        tip: true表示有元素出现，false表示超时
  BrowserElement.wait_any_group:
    title: 等待任意一组元素出现（web）
    comment: 在浏览器对象 @{browser_obj} 中等待(@{group_a_name}或@{group_b_name})任意一组元素全部出现，最长等待 @{element_timeout} 秒，命中组名保存至 @{hit_group_name}
    icon: wait-element-web
    helpManual: 配置两组元素(A/B)，组内全部元素出现即该组命中；常用于多元素共同标识一个页面状态的场景(如表单页同时有标题和提交按钮)
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: group_a_name
        title: A组名称
        tip: A组命中时输出的名称(默认"组A")
      - key: element_a_1
        title: A组元素1拾取
        tip: 拾取A组第1个元素
      - key: element_a_2
        title: A组元素2拾取
        tip: 拾取A组第2个元素(可选)
      - key: element_a_3
        title: A组元素3拾取
        tip: 拾取A组第3个元素(可选)
      - key: group_b_name
        title: B组名称
        tip: B组命中时输出的名称(默认"组B")
      - key: element_b_1
        title: B组元素1拾取
        tip: 拾取B组第1个元素
      - key: element_b_2
        title: B组元素2拾取
        tip: 拾取B组第2个元素(可选)
      - key: element_b_3
        title: B组元素3拾取
        tip: 拾取B组第3个元素(可选)
      - key: element_timeout
        title: 等待时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: hit_group_name
        title: 命中组名保存至
        tip: 最先全部出现的组名，超时为空字符串
      - key: wait_result
        title: 等待结果保存至
        tip: true表示有组命中，false表示超时
  BrowserElement.combine_elements:
    title: 组合多元素（web）
    comment: 将拾取的多个元素(@{element_1}~@{element_5})合成一个元素列表，保存至 @{elements}
    icon: get-similar-elements-web
    helpManual: 将最多5个拾取的网页元素组合成元素列表(含数量)，供循环遍历或批量操作使用
    inputList:
      - key: element_1
        title: 元素1拾取
        tip: 拾取第1个元素
      - key: element_2
        title: 元素2拾取
        tip: 拾取第2个元素(可选)
      - key: element_3
        title: 元素3拾取
        tip: 拾取第3个元素(可选)
      - key: element_4
        title: 元素4拾取
        tip: 拾取第4个元素(可选)
      - key: element_5
        title: 元素5拾取
        tip: 拾取第5个元素(可选)
    outputList:
      - key: elements
        title: 元素列表保存至
        tip: 组合后的网页元素对象列表
      - key: element_count
        title: 元素数量保存至
        tip: 列表中的元素个数
  BrowserElement.get_similar_lazy:
    title: 获取相似元素列表-懒加载（web）
    comment: 滚动加载浏览器对象 @{browser_obj} 中元素 @{element_data} 的全部相似元素，保存至 @{lazy_elements}
    icon: get-similar-elements-web
    helpManual: 自动滚动页面触发懒加载，持续收集相似元素直到数量不再增长(连续stable_rounds轮不增)或达到上限；适用于无限滚动的长列表页面
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: element_data
        title: 相似元素拾取
        tip: 拾取一个相似元素作为模板
      - key: max_rounds
        title: 最大滚动轮数
        tip: 最多滚动次数，默认20
      - key: stable_rounds
        title: 停止判定轮数
        tip: 连续N轮数量不增长即停止，默认2
      - key: wait_load
        title: 每轮等待加载（秒）
        tip: 每次滚动后等待新内容加载的时间，默认1秒
      - key: max_count
        title: 数量上限
        tip: 达到该数量提前停止，0表示不限
      - key: element_timeout
        title: 等待元素时间（秒）
        tip: 初始等待元素出现的超时时间
    outputList:
      - key: lazy_elements
        title: 元素列表保存至
        tip: 懒加载收集到的全部相似元素对象列表
      - key: lazy_count
        title: 元素数量保存至
        tip: 列表中的元素个数
  BrowserElement.get_similar_lazy_xpath:
    title: 懒加载-XPath版（web）
    comment: 按XPath(@{xpath})滚动加载浏览器对象 @{browser_obj} 中的全部元素，文本保存至 @{texts}
    icon: get-similar-elements-web
    helpManual: 按XPath表达式自动滚动加载全部元素，输出每个元素的文本列表；适用于无法拾取但可用XPath描述的无限滚动列表
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: xpath
        title: XPath表达式
        tip: 如 //div[@class="item"]
      - key: max_rounds
        title: 最大滚动轮数
        tip: 最多滚动次数，默认20
      - key: stable_rounds
        title: 停止判定轮数
        tip: 连续N轮数量不增长即停止，默认2
      - key: wait_load
        title: 每轮等待加载（秒）
        tip: 每次滚动后等待新内容加载的时间，默认1秒
      - key: max_count
        title: 数量上限
        tip: 达到该数量提前停止，0表示不限
      - key: element_timeout
        title: 等待元素时间（秒）
        tip: 初始等待元素出现的超时时间
    outputList:
      - key: texts
        title: 文本列表保存至
        tip: 每个命中元素的文本内容列表
      - key: lazy_count
        title: 元素数量保存至
        tip: 文本列表的项数
  BrowserElement.paginator:
    title: 翻页器-XPath（web）
    comment: 循环浏览器对象 @{browser_obj} 的分页，自动点击下一页(@{next_xpath})，每页文本(@{item_xpath})保存至 @{page_texts}
    icon: get-similar-elements-web
    helpManual: 自动翻页循环指令：每页输出页码与条目文本列表，页体处理完成后自动点击下一页按钮，直到无下一页或达到最大页数；适用于分页列表数据采集
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: next_xpath
        title: 下一页按钮XPath
        tip: 如 //a[@class="next"]
      - key: item_xpath
        title: 条目XPath
        tip: 每页数据条目的XPath，如 //ul[@class="list"]/li(可选)
      - key: max_pages
        title: 最大页数
        tip: 最多翻到第几页，0表示不限直到无下一页
      - key: wait_load
        title: 翻页等待（秒）
        tip: 点击下一页后等待页面加载的时间，默认1秒
      - key: element_timeout
        title: 等待元素时间（秒）
        tip: 初始等待超时时间
    outputList:
      - key: page_no
        title: 当前页码保存至
        tip: 从1开始的页码
      - key: page_texts
        title: 本页文本列表保存至
        tip: 当前页条目文本列表(未配置条目XPath时为空列表)
  BrowserElement.get_text_nodes:
    title: 获取文本节点内容（web）
    comment: 获取浏览器对象 @{browser_obj} 中元素(@{xpath})的全部文本节点，保存至 @{text_nodes}
    icon: get-element-text-web
    helpManual: 按XPath定位元素并遍历其内部全部文本节点，输出非空文本列表；适用于一个元素内含多段文本需要分别提取的场景
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: xpath
        title: XPath表达式
        tip: 如 //div[@class="item"]
    outputList:
      - key: text_nodes
        title: 文本节点列表保存至
        tip: 元素内全部非空文本节点内容列表
  BrowserElement.universal_set_select:
    title: 通用设置下拉框（web）
    comment: 点击浏览器对象 @{browser_obj} 中的下拉触发元素(@{xpath})后，按文本(@{option_text})点击选项
    icon: set-select-web
    helpManual: 兼容非select标签的自定义下拉框：先点击触发元素展开选项，再轮询查找并点击匹配文本的选项(li/[role=option]/常见组件库选项类名)；纯select标签请使用常规设置下拉框指令
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: xpath
        title: 触发元素XPath
        tip: 点击后展开选项的元素，如 //div[@class="trigger"]
      - key: option_text
        title: 选项文本
        tip: 要选择的选项完整或部分文本
      - key: wait_timeout
        title: 等待选项超时（秒）
        tip: 等待选项出现的最长时间，默认5秒
    outputList:
      - key: select_result
        title: 选择结果
        tip: 成功选中文本返回true，超时未找到返回false
  BrowserElement.get_font_color:
