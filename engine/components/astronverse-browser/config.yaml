atomic:
  BrowserElement.wait_element:
    title: 等待元素（web）
    comment: 等待浏览器对象 @{browser_obj} 中元素 @{element_data} 的（@{ele_status}）
    icon: wait-element-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择指定的网页元素所在的浏览器对象
      - key: element_data
        title: 元素拾取
        tip: 拾取需要等待的网页元素
      - key: ele_status
        title: 等待类型
        tip: 等待出现或者等待消失
      - key: element_timeout
        title: 等待元素时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: wait_element
        title: 等待结果
        tip: 输出元素是否出现/消失，出现/消失为true，反之为false
  BrowserElement.click:
    title: 点击元素（web）
    comment: 通过 @{button_type:点击} 的形式点击浏览器对象 @{browser_obj} 中的元素 @{element_data}
    icon: click-element-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要等待页面所在的浏览器对象
      - key: element_data
        title: 拾取元素
        tip: 拾取需要操作的元素信息
      - key: simulate_flag
        title: 模拟人工点击
        tip: 模拟人工点击是模拟人为操作方式点击，否则将根据拾取元素的自动化接口进行点击
      - key: assistive_key
        title: 辅助按键
        tip: 在点击时需要按下的键盘功能按键
      - key: button_type
        title: 点击键位
        tip: 选择模拟鼠标点击的方式
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
      - key: scroll_into_center
        title: 元素滚动到可视区域中心
        tip: 选择是否将元素滚动到可视区域中心位置，若部分网页可能错位，可选择关闭此功能
    outputList: []
  BrowserElement.input:
    title: 填写输入框（web）
    comment: >-
      在指定的浏览器对象 @{browser_obj} 中拾取输入框 @{element_data} ，以 @{fill_type:键盘输入/剪贴板输入}
      的形式输入内容 ，将执行结果输出至 @{form_input}
    icon: fill-input-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要等待页面所在的浏览器对象
      - key: element_data
        title: 拾取输入框
        tip: 拾取需要填写内容的输入框元素
      - key: simulate_flag
        title: 模拟人工输入
        tip: 模拟人工输入是模拟人为操作方式输入，否则将根据元素的自动化接口进行输入
      - key: fill_type
        title: 输入类型
        tip: 选择填写输入框的方式
      - key: fill_input
        title: 输入内容
        tip: 填写输入框的内容
      - key: fill_input_credential
        title: 选择凭据
        tip: ''
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
      - key: focus_time
        title: 焦点睡眠时间
        tip: 焦点停顿时间(ms)
      - key: write_gap_time
        title: 按键输入间隔
        tip: 输入内容输入的时间间隔(s)
      - key: input_type
        title: 追加输入
        tip: 是否对输入框进行追加输入
      - key: scroll_into_center
        title: 元素滚动到可视区域中心
        tip: 选择是否将元素滚动到可视区域中心位置，若部分网页可能错位，可选择关闭此功能
    outputList:
      - key: form_input
        title: 用户输入内容
        tip: ''
  BrowserElement.hover_over:
    title: 鼠标悬停在元素上（web）
    comment: 鼠标悬停在浏览器对象 @{browser_obj} 中的元素 @{element_data} 上
    icon: mouse-hover-element-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要等待页面所在的浏览器对象
      - key: element_data
        title: 悬停元素拾取
        tip: 拾取鼠标要悬停的元素
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
      - key: scroll_into_center
        title: 元素滚动到可视区域中心
        tip: 选择是否将元素滚动到可视区域中心位置，若部分网页可能错位，可选择关闭此功能
    outputList: []
  BrowserElement.screenshot:
    title: 拾取元素截图（web）
    comment: 拾取浏览器对象 @{browser_obj} 的元素 @{element_data} 并输出为图片
    icon: pick-element-screenshot-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择截图元素所在的浏览器对象
      - key: element_data
        title: 拾取元素
        tip: 拾取需要截图的元素
      - key: file_path
        title: 截图保存路径
        tip: 文件夹路径
      - key: image_name
        title: 图片名称
        tip: 携带后缀的名称比如图片.jpg
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: xpath_shot
        title: 截图文件路径
        tip: 截图文件路径
  BrowserElement.position_screenshot:
    title: 元素位置截图（web）
    comment: 获取浏览器对象 @{browser_obj} 的元素 @{element_data} 位置截图并输出为图片
    icon: element-position-screenshot-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: ''
      - key: element_data
        title: 拾取元素
        tip: ''
      - key: file_path
        title: 截图保存路径
        tip: ''
      - key: image_name
        title: 图片名称
        tip: ''
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: ''
    outputList:
      - key: position_shot
        title: 截图文件路径
        tip: ''
  BrowserElement.scroll:
    title: 网页滚动
    comment: >-
      通过 @{scroll_direction:横向/纵向} 的方向，从（@{x_scroll_type||y_scroll_type}）滚动浏览器对象
      @{browser_obj} 的滚动条
    icon: mouse-scroll-webpage
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要滑动滚动条的网页所在浏览器对象
      - key: scrollbar_type
        title: 滚动目标
        tip: 选择网页窗口滚动条或指定网页上某个滚动条元素
      - key: element_data
        title: 拾取滚动条
        tip: 拾取需要在网页上滚动操作的滚动条元素
      - key: scroll_direction
        title: 滚动方向
        tip: ''
      - key: x_scroll_type
        title: 横向滚动位置
        tip: ''
      - key: x_custom_scroll_dis
        title: 横向自定义滚动距离
        tip: 单位为屏幕的分辨率像素px，一般为0-9999之间的数值
      - key: y_scroll_type
        title: 纵向滚动位置
        tip: ''
      - key: y_custom_scroll_dis
        title: 纵向自定义滚动距离
        tip: 单位为屏幕的分辨率像素px，一般为0-9999之间的数值
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList: []
  BrowserElement.scroll_into_view:
    title: 元素置于可视区域（web）
    comment: 将网页元素 @{element_data} 置于可视区域
    icon: element-to-visible-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要可视的元素所在的浏览器对象
      - key: element_data
        title: 拾取可视目标
        tip: 拾取需要可视的目标元素
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
      - key: scroll_into_center
        title: 元素滚动到可视区域中心
        tip: 选择是否将元素滚动到可视区域中心位置，若部分网页可能错位，可选择关闭此功能
    outputList: []
  BrowserElement.similar:
    title: 获取相似元素列表（web）
    comment: >-
      获取浏览器对象 @{browser_obj} 中与拾取到的元素 @{element_data} 相似的元素，并将相似元素数组输出至
      @{get_similar_ele}，相似元素个数为@{similar_count}
    icon: get-similar-elements-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择相似元素所在的浏览器对象
      - key: element_data
        title: 相似元素拾取
        tip: 在网页上拾取不同位置的两个相似元素
      - key: get_type
        title: 元素操作
        tip: ''
      - key: attribute_name
        title: 属性名称
        tip: ''
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: get_similar_ele
        title: 元素信息
        tip: ''
      - key: similar_count
        title: 相似元素个数
        tip: 获取到的相似元素列表项个数
  BrowserElement.loop_similar:
    title: 循环相似元素列表（web）
    comment: >-
      获取浏览器对象 @{browser_obj} 中与拾取到的元素 @{element_data}
      相似的元素，从起始项@{start}到结束项@{end}进行循环操作，输出列表循环至@{item}, 是否输出循环项位置为@{index}
    icon: loop-similar-elements-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择相似元素所在的浏览器对象
      - key: element_data
        title: 相似元素拾取
        tip: 在网页上拾取不同位置的两个相似元素
      - key: get_type
        title: 元素操作
        tip: ''
      - key: start
        title: 起始位置
        tip: 下标位置从0开始
      - key: end
        title: 结束位置
        tip: 下标位置从0开始,-1代表循环至最后一个元素
      - key: attribute_name
        title: 属性名称
        tip: ''
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: index
        title: 循环项位置
        tip: 默认变量可修改，用于遍历列表的变量索引数值
      - key: item
        title: 循环项
        tip: 默认变量可修改，用于遍历列表的变量
  BrowserElement.element_text:
    title: 获取元素文本内容（web）
    comment: 获取浏览器对象 @{browser_obj} 网页中拾取的元素 @{element_data} 文本内容，并将结果输出至 @{data_pick}
    icon: get-element-text-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要获取文本的元素所在的浏览器对象
      - key: element_data
        title: 元素拾取
        tip: 选择要获取文本的元素位置
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: data_pick
        title: 输出变量
        tip: 输出获取到的当前网页标题字符串
  BrowserElement.slider_hover:
    title: 拾取滑块拖拽（web）
    comment: >-
      将滑块 @{element_slider} 从 @{drag_type} 向 @{drag_direction} 拖拽
      @{percent_value} %
    icon: pick-slider-drag-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: ''
      - key: element_slider
        title: 拾取滑块
        tip: ''
      - key: element_progress
        title: 拾取轨道
        tip: ''
      - key: percent_value
        title: 滑块移动比例
        tip: ''
      - key: drag_direction
        title: 拖拽方向
        tip: ''
      - key: drag_type
        title: 拖拽类型
        tip: ''
      - key: duration
        title: 拖动的持续时间
        tip: ''
    outputList: []
  BrowserElement.get_select:
    title: 获取下拉框（web）
    comment: 在浏览器对象 @{browser_obj} 中获取下拉框 @{element_data}
    icon: get-dropdown-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: ''
      - key: element_data
        title: 拾取下拉框
        tip: ''
      - key: current_content
        title: 获取当前选中内容
        tip: 选中内容或者所有内容
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: get_selected
        title: 下拉框选中内容
        tip: ''
  BrowserElement.get_checked:
    title: 获取复选框（web）
    comment: 在浏览器对象 @{browser_obj} 中获取复选框 @{element_data}
    icon: get-checkbox-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: ''
      - key: element_data
        title: 拾取复选框
        tip: ''
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: get_checkbox_checked
        title: 复选框选中内容
        tip: ''
  BrowserElement.set_select:
    title: 操作下拉框（web）
    comment: 在浏览器对象 @{browser_obj} 中获取下拉框 @{element_data} ，通过 @{pattern} 选择 @{value}
    icon: operate-dropdown-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: ''
      - key: element_data
        title: 拾取下拉框
        tip: ''
      - key: pattern
        title: 匹配模式
        tip: ''
      - key: value
        title: 匹配内容
        tip: ''
      - key: solution
        title: 顺序
        tip: ''
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList: []
  BrowserElement.set_checked:
    title: 操作复选框（web）
    comment: 在浏览器对象 @{browser_obj} 中获取复选框 @{element_data} 后 @{checked_type}
    icon: operate-checkbox-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: ''
      - key: element_data
        title: 拾取复选框
        tip: ''
      - key: checked_type
        title: 操作类型
        tip: ''
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList: []
  BrowserElement.element_operation:
    title: 元素操作（web）
    comment: 在浏览器对象 @{browser_obj} 中获取 @{element_data} 并 @{operation_type}
    icon: element-operation-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: ''
      - key: element_data
        title: 拾取元素
        tip: ''
      - key: operation_type
        title: 操作类型
        tip: 设置-获取-删除信息
      - key: get_type
        title: 信息类型
        tip: ''
      - key: attribute_name
        title: 属性名称
        tip: 填写属性名称，例如：id、class, data-id等
      - key: position
        title: 相对位置
        tip: ''
      - key: attribute_value
        title: 属性值
        tip: ''
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: get_ele_attr
        title: 元素属性
        tip: ''
      - key: get_ele_value
        title: 元素值
        tip: ''
      - key: get_ele_html
        title: 元素源代码
        tip: ''
      - key: get_ele_link
        title: 元素链接地址
        tip: ''
      - key: get_ele_text
        title: 元素文本内容
        tip: ''
      - key: get_ele_position
        title: 元素位置
        tip: ''
      - key: get_ele_selected
        title: 元素选中状态
        tip: ''
      - key: get_ele_style
        title: 元素样式
        tip: ''
  BrowserElement.get_table:
    title: 获取表格数据（web）
    comment: 获取浏览器对象 @{browser_obj} 中的表格 @{element_data} ，将结果输出为 @{table_pick}
    icon: get-table-data-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要等待页面所在的浏览器对象
      - key: element_data
        title: 拾取表格
        tip: 拾取网页表格中任一单元格元素，无须拾取整个表格
      - key: to_excel
        title: 存储到表格文档
        tip: 可直接存储为excel文档
      - key: excel_path
        title: 表格文档路径
        tip: 请选择文档存储路径
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: table_pick
        title: 表格对象
        tip: 输出获取的表格对象，数据类型：字典
  BrowserElement.data_batch:
    title: 数据抓取（web）
    comment: 在指定的浏览器对象 @{browser_obj} 中抓取 @{batch_data} ，将结果输出为 @{table_pick}
    icon: data-scraping-web
    helpManual: ''
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择要等待页面所在的浏览器对象
      - key: batch_data
        title: 抓取对象
        tip: 拾取需要抓取的元素
      - key: multi_page
        title: 是否抓取多页
        tip: 选择需要是否抓取多页，默认抓取当前页
      - key: page_count
        title: 抓取页数
        tip: 填写需要抓取的总页数，例如：抓取10页，则填写10
      - key: page_interval
        title: 翻页间隔时间，单位：秒
        tip: 填写翻页的间隔时间，若间隔时间过短导致页面加载不完全，可适当增加翻页间隔时间
      - key: element_data
        title: 翻页按钮
        tip: 拾取需要翻页的元素
      - key: simulate_flag
        title: 模拟人工输入
        tip: 模拟人工输入是模拟人为操作方式输入，否则将根据元素的自动化接口进行输入
      - key: button_type
        title: 点击键位
        tip: 选择模拟鼠标点击的方式
      - key: to_excel
        title: 存储到表格文档
        tip: 可直接存储为excel文档
      - key: excel_path
        title: 表格文档路径
        tip: 请选择文档存储路径
      - key: element_timeout
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
      - key: output_type
        title: 输出类型
        tip: 选择表格输出类型，默认输出为行
      - key: output_head
        title: 是否输出表头
        tip: 选择是否输出表头，默认输出表头
      - key: output_filter_empty_col
        title: 是否过滤空列
        tip: 选择是否过滤表格中的空列
      - key: is_save_to_data_table
        title: 是否保存到数据表格
        tip: 选择是否将数据抓取的结果保存到数据表格中
      - key: scroll_into_center
        title: 元素滚动到可视区域中心
        tip: 选择是否将翻页按钮元素滚动到可视区域中心位置，若部分网页可能错位，可选择关闭此功能
    outputList:
      - key: table_pick
        title: 表格对象
        tip: 输出获取的表格对象，数据类型：字典
      - key: table_path
        title: 表格路径
        tip: 输出保存的表格路径
  BrowserElement.create_element:
    title: 获取元素对象（web）
    comment: >-
      在指定的浏览器对象 @{browser_obj} 中根据 @{locate_type}获取元素对象 ，将结果输出为元素对象
      @{element_obj}
    icon: get-element-object-web
