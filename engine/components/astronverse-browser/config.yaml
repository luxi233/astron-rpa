  BrowserIframe.init_iframe:
    title: 初始化iframe（web）
    comment: 在浏览器对象 @{browser_obj} 中以(@{locate_mode:序号/名称/XPath})定位iframe，frame标识保存至 @{frame}
    icon: get-current-obj-web
    helpManual: 按序号/名称/XPath定位页面iframe并生成frame标识对象(含iframeXpath路由信息)；支持parent_frame参数在已定位frame内继续定位嵌套子iframe；跨域iframe同样支持
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: locate_mode
        title: 定位方式
        tip: 按序号/名称/XPath定位iframe
      - key: index
        title: iframe序号
        tip: 页面中iframe的序号，从0开始
      - key: name
        title: iframe名称
        tip: iframe标签的name属性值
      - key: xpath
        title: XPath表达式
        tip: iframe元素的XPath，如 //iframe[@id="frame1"]
      - key: parent_frame
        title: 父frame对象
        tip: 留空在主文档定位，传入则在该frame内定位嵌套子iframe
