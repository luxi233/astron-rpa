    helpManual: 传入init_iframe获取的frame对象切换活动上下文，后续iframe指令可不传frame参数直接沿用；留空切换回主文档；切换时会探测目标frame可达性
    inputList:
      - key: browser_obj
        title: 浏览器对象
        tip: 选择浏览器对象(不选则使用已打开的浏览器)
      - key: frame
        title: frame对象
        tip: init_iframe输出的frame标识；留空切换回主文档
    outputList:
      - key: current_frame
        title: 当前frame保存至
        tip: 切换后的活动frame对象(主文档时isFrame为false)
