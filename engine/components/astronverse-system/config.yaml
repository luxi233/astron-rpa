atomic:
  System.copy_clip:
    title: 复制到剪切板
    comment: 将 @{content_type}  @{message||file_path||folder_path} 复制到剪切板
    icon: copy-to-clipboard
    helpManual: 支持将文本内容/文件/文件夹复制到剪切板
    inputList:
      - key: content_type
        title: 复制类型
        tip: 选择复制到剪贴板的内容类型
      - key: message
        title: 待复制的文本内容
        tip: 输入文本内容
      - key: file_path
        title: 待复制的文件路径
        tip: 输入或选择待复制文件
      - key: folder_path
        title: 待复制的文件夹路径
        tip: 输入或选择待复制文件夹
    outputList: []
  System.clear_clip:
    title: 清空剪切板
    comment: 清空剪切板中的内容
    icon: clear-clipboard
    helpManual: 清空剪切板中的内容
    inputList: []
    outputList: []
  System.paste_clip:
    title: 获取剪切板
    comment: 获取剪切板中的 @{content_type} ，并保存至变量 @{output_content}
    icon: get-clipboard
    helpManual: 支持获取剪切板中的文本内容/文件/文件夹，并将文本内容/文件文件夹保存路径保存到指定路径中
    inputList:
      - key: content_type
        title: 获取类型
        tip: 选择剪切板中要获取的内容类型
      - key: dst_path
        title: 保存路径
        tip: 请输入或选择保存路径
      - key: state_type
        title: 保存路径不存在时
        tip: 设置保存路径不存在时执行的操作
      - key: dst_file_name
        title: 文件保存名称
        tip: 输入保存的文件名，不需加文件后缀，为空自动使用原文件名
      - key: dst_folder_name
        title: 文件夹保存名称
        tip: 输入保存的文件夹名称，为空自动使用原文件夹名称
    outputList:
      - key: output_content
        title: 输出剪切板内容至变量
        tip: 获取文本内容输出为文本变量，获取文件/文件夹输出为路径信息
  System.compress:
    title: 压缩
    comment: 压缩 @{file_type} 到指定目录 @{compress_dir} 中，并保存压缩包路径至 @{compress_path}
    icon: compress
    helpManual: 压缩选择文件与文件夹到指定目录，支持单个或多个文件文件夹同时压缩为一个压缩包(压缩后文件格式为zip格式)
    inputList:
      - key: file_type
        title: 选择压缩方式
        tip: 选择压缩文件/文件夹/文件和文件夹
      - key: file_path
        title: 待压缩文件
        tip: 选择或输入待压缩文件路径
      - key: folder_path
        title: 待压缩文件夹
        tip: 选择或输入待压缩文件夹路径
      - key: compress_dir
        title: 目标路径
        tip: 保存目标压缩文件路径
      - key: state_type
        title: 目标路径不存在时
        tip: 选择目标路径不存在时执行的操作
      - key: compress_name
        title: 压缩包名称
        tip: 指定压缩包名称，为空则默认以压缩列表中第一个压缩文件名称命名
      - key: pwd
        title: 压缩密码
        tip: 为压缩包设置解压缩密码
      - key: save_type
        title: 压缩后源文件是否保存
        tip: ''
    outputList:
      - key: compress_path
        title: 输出压缩后压缩包路径
        tip: ''
  System.uncompress:
    title: 解压
    comment: >-
      将压缩文件 @{source_path} 解压至指定目录 @{target_path} 下，并输出解压后文件所在路径
      @{uncompress_path}
    icon: decompress
    helpManual: 将压缩文件解压至指定路径
    inputList:
      - key: source_path
        title: 压缩包路径
        tip: 请选择或输入压缩包路径
      - key: target_path
        title: 目标解压目录
        tip: 选择或输入解压后文件保存路径
      - key: status_type
        title: 目标目录不存在时
        tip: 选择目标目录不存在时执行的操作，默认直接创建
      - key: pwd
        title: 解压密码
        tip: ''
      - key: save_type
        title: 解压缩后源文件是否保留
        tip: 解压后对源文件的操作，默认保留
    outputList:
      - key: uncompress_path
        title: 输出解压后文件路径
        tip: ''
  System.wait:
    title: 等待
    comment: 等待指定时长后继续执行流程，实际等待时长保存至 @{wait_seconds}
    icon: set-time
    helpManual: 让流程等待一段时间后再继续执行，支持固定时长与随机时长两种模式。固定时长可直接输入小数实现毫秒级等待（如0.01秒）；随机时长在最小值与最大值之间随机取值，适用于模拟人工操作间隔
    inputList:
      - key: wait_type
        title: 等待方式
        tip: 选择固定时长或随机时长
      - key: delay
        title: 时长(秒)
        tip: 输入等待时长，单位为秒，支持小数如0.01
      - key: min_delay
        title: 最小时长(秒)
        tip: 随机等待时长的下限，单位为秒
      - key: max_delay
        title: 最大时长(秒)
        tip: 随机等待时长的上限，单位为秒
    outputList:
      - key: wait_seconds
        title: 输出实际等待时长(秒)至变量
        tip: 流程实际等待的时长，随机模式下为随机取到的时长
  System.human_sim_start:
    title: 开启模拟真人操作
    comment: 开启模拟真人操作（仿真移动鼠标@{enable_move}、仿真点击元素@{enable_click}、仿真操作停顿@{enable_pause}），直至执行【结束模拟真人操作】指令
    icon: keyboard-simulate-key
    helpManual: 一次对多个指令模拟真人的操作习惯运行（从开启到结束区间内的指令），可降低被反爬的概率。仿真移动鼠标：模拟真人按随机路线和速度移动鼠标；仿真点击元素：模拟真人在元素附近随机位置点击；仿真操作停顿：模拟真人在操作之间随机停顿
    inputList:
      - key: enable_move
        title: 仿真移动鼠标
        tip: 模拟真人按随机路线和速度移动鼠标
      - key: enable_click
        title: 仿真点击元素
        tip: 模拟真人在元素附近随机位置点击
      - key: enable_pause
        title: 仿真操作停顿
        tip: 模拟真人在操作之间随机停顿
      - key: min_pause
        title: 最小停顿时长(秒)
        tip: 指令执行完成后的最短等待时间
      - key: max_pause
        title: 最大停顿时长(秒)
        tip: 指令执行完成后的最长等待时间
    outputList: []
  System.human_sim_end:
    title: 结束模拟真人操作
    comment: 结束模拟真人操作，之后的指令恢复正常执行
    icon: group-end
    helpManual: 结束模拟真人操作区间，之后的桌面鼠标/键盘指令恢复正常执行模式
    inputList: []
    outputList: []
  File.file_exist:
    title: IF文件存在
    comment: 判断文件 @{file_path} 是否存在，存在就执行以下操作
    icon: check-file-exists
    helpManual: 判断文件是否存在并将判断结果输出至变量
    inputList:
      - key: file_path
        title: 文件路径
        tip: 输入或选择文件路径
      - key: exist_type
        title: 判断类型
        tip: 选择判断类型
    outputList: []
  File.file_create:
    title: 创建文件
    comment: 在指定目录 @{dst_path} 下创建文件 @{file_name} ，并保存创建文件路径到 @{new_file_path}
    icon: create-new-file
    helpManual: 在指定目录下创建文件
    inputList:
      - key: dst_path
        title: 指定目录
        tip: 输入或选择指定文件夹目录
      - key: file_name
        title: 文件名称
        tip: 输入文件名称及扩展名
      - key: exist_options
        title: 文件存在时
        tip: >-
          选择创建文件已存在时的操作；生成副本:将在文件名称后增加数字标识，如a(1).txt，如果副本文件同样存在，则数字递增；覆盖:删除已存在文件并重新创建；跳过:返回当前已存在文件路径
    outputList:
      - key: new_file_path
        title: 创建文件路径
        tip: 输出创建文件路径，并保存到变量中，数据类型为字符串
  File.file_delete:
    title: 删除文件
    comment: 删除文件 @{file_path} ，并将结果输出至变量 @{delete_file_result}
    icon: delete-file
    helpManual: 删除指定文件，并将执行结果输出至变量
    inputList:
      - key: file_path
        title: 待删除文件
        tip: 选择或输入待删除文件路径
      - key: delete_options
        title: 删除操作
        tip: 选择将文件彻底删除或移入回收站
    outputList:
      - key: delete_file_result
        title: 输出删除结果至
        tip: 将文件删除结果保存至变量，数据类型为布尔值
  File.file_copy:
    title: 复制文件
    comment: 复制文件 @{file_path} 到指定目录 @{target_path} 下，并保存复制后的文件路径 @{copy_file_path}
    icon: copy-file
    helpManual: 复制目标文件到指定目录
    inputList:
      - key: file_path
        title: 待复制文件
        tip: 选择或输入待复制文件路径
      - key: target_path
        title: 指定目录
        tip: 选择或输入目标目录
      - key: state_type
        title: 目录不存在时
        tip: 设置指定目录不存在时执行的操作
      - key: file_name
        title: 复制后文件名
        tip: 指定复制后文件名，无需输入文件扩展名，为空默认使用原文件名称
      - key: copy_options
        title: 文件存在时
        tip: >-
          选择指定目录下文件已存在时的操作； 生成副本:将在文件名称后增加数字标识，如a(1).txt，如果副本文件同样存在，则数字递增；
          覆盖:删除已存在文件并重新创建； 跳过:返回当前已存在文件路径
    outputList:
      - key: copy_file_path
        title: 复制后文件路径
        tip: 输出复制后文件路径，并保存至变量，数据类型为字符串
  File.file_write:
    title: 写入文件
    comment: 写入内容 @{msg} 到文件 @{file_path} 中，并保存写入后的文件路径 @{write_file_path}
    icon: write-file
    helpManual: 向指定文件中写入内容，并输出写入后的文件路径至变量
    inputList:
      - key: file_path
        title: 文件路径
        tip: 选择或输入文件路径，支持写入的文件类型有：".txt"， ".docx"， ".md"， ".py"， ".json"， ".csv"
      - key: file_option
        title: 文件不存在时
        tip: 选择文件不存在时执行的操作
      - key: msg
        title: 写入内容
        tip: 输入要写入的内容
      - key: write_type
        title: 写入方式
        tip: 指定写入方式
      - key: encode_type
        title: 编码方式
        tip: 选择写入内容的编码方式，文件内容为空时需指定，默认选项时自动使用待写入文件的编码方式
    outputList:
      - key: write_file_path
        title: 文件路径
        tip: 输出写入后文件路径至变量，数据类型为字符串
  File.get_file_encoding_type:
    title: 获取文件编码类型
    comment: 获取文件 @{file_path} 的编码类型并保存至变量 @{file_encoding_type}
    icon: get-file-encoding
    helpManual: 获取指定文件的编码类型，并输出编码类型至变量
    inputList:
      - key: file_path
        title: 文件路径
        tip: 选择或输入待获取编码类型的文件路径
    outputList:
      - key: file_encoding_type
        title: 文件编码类型
        tip: 输出文件编码类型至变量，数据类型为字符串
  File.file_read:
    title: 读取文件
    comment: 按照 @{read_type} 方式读取文件 @{file_path} 中的内容，并保存至变量 @{read_file_content}
    icon: read-file
    helpManual: 读取指定文件内容，并将读取内容输出保存至变量
    inputList:
      - key: file_path
        title: 待读取文件路径
        tip: >-
          选择或输入待读取文件路径， 支持读取的文件类型有：".txt"， ".docx"， ".md"， ".py"， ".json"，
          ".csv"
      - key: read_type
        title: 读取方式
        tip: 选择读取方式，全部读取:读取全部内容； 按行读取:按行读取文本内容； 二进制:以二进制方式读取文件内容
      - key: encode_type
        title: 编码方式
        tip: 选择读取内容的编码方式，默认选项时自动使用待读取文件的编码方式
    outputList:
      - key: read_file_content
        title: 读取内容为
        tip: 输出读取内容至变量，数据类型为字符串
  File.file_move:
    title: 移动文件
    comment: 将文件 @{file_path} 移动至指定目录 @{target_folder} 下，并保存移动后的文件路径 @{move_file_path}
    icon: move-file
    helpManual: 将指定文件移动到目标目录，并输出移动后的文件路径至变量
    inputList:
      - key: file_path
        title: 待移动文件路径
        tip: 选择或输入待移动文件路径
      - key: target_folder
        title: 指定目录
        tip: 选择或输入目标目录， 指定目录不存在时默认自动创建
      - key: state_type
        title: 目录不存在时
        tip: 设置指定目录不存在时执行的操作
      - key: file_name
        title: 移动后文件名
        tip: 输入移动后文件名(不需后缀名)，默认为空使用原文件名
      - key: exist_options
        title: 文件存在时
        tip: 选择文件存在时执行的操作（覆盖、跳过、生成副本）
    outputList:
      - key: move_file_path
        title: 移动后文件路径
        tip: 输出移动后文件路径至变量，数据类型为字符串
  File.file_rename:
    title: 重命名文件
    comment: 将文件 @{file_path} 重命名为 @{new_name} 并保存重命名后的文件路径 @{rename_file_path}
    icon: rename-file
    helpManual: 将指定文件重命名，并输出重命名后的文件路径至变量
    inputList:
      - key: file_path
        title: 待重命名文件路径
        tip: 选择或输入待重命名文件路径
      - key: new_name
        title: 新文件名
        tip: 输入新文件名(不需后缀名)
      - key: exist_options
        title: 文件存在时
        tip: 选择文件存在时执行的操作（覆盖、跳过、生成副本）
    outputList:
      - key: rename_file_path
        title: 重命名后文件路径
        tip: 输出重命名后文件路径至变量，数据类型为字符串
  File.file_search:
    title: 查找文件
    comment: >-
      在 @{folder_path} 目录中查找文件名包含 @{search_pattern} 的文件，并保存匹配文件路径至变量
      @{find_file_result}
    icon: find-file
    helpManual: 在指定目录中查找文件名包含指定内容的文件，并输出文件列表至变量
    inputList:
      - key: folder_path
        title: 待查找文件所在目录
        tip: 选择或输入待查找文件所在目录
      - key: find_type
        title: 查找方式
        tip: 指定查找方式：精确匹配需输入完整文件名；模糊匹配输入部分文件名，需区分大小写；正则表达式匹配输入正则表达式
      - key: search_pattern
        title: 查找文件名
        tip: 输入查找内容
      - key: traverse_subfolder
        title: 遍历子文件夹
        tip: 选择是否遍历子文件夹
    outputList:
      - key: find_file_result
        title: 保存查找结果至
        tip: 输出匹配文件路径列表，并保存到变量，数据类型为列表
  File.file_wait_status:
    title: 等待文件
    comment: 等待文件 @{file_path} 状态为 @{status_type} 时执行下一步，保存等待结果到 @{wait_file_result}
    icon: wait-file
    helpManual: 等待文件状态为指定状态时执行下一步，并输出等待结果至变量
    inputList:
      - key: file_path
        title: 文件路径
        tip: 选择或输入文件路径
      - key: status_type
        title: 等待状态
        tip: 选择等待文件的状态
      - key: wait_time
        title: 超时时间
        tip: 设置等待超时时间，单位为秒
    outputList:
      - key: wait_file_result
        title: 保存等待结果至
        tip: 输出等待结果至变量，数据类型为布尔值
  File.file_info:
    title: 获取文件信息
    comment: 获取指定文件 @{file_path} 的 @{info_type} 信息，并保存文件信息至变量 @{file_info}
    icon: get-file-info
    helpManual: 获取文件的全部信息/大小/文件路径/大小(字节)/根目录/文件夹目录/名称与扩展名/名称/扩展名/创建时间/修改时间，并保存到输出变量
    inputList:
      - key: file_path
        title: 文件路径
        tip: 选择或输入文件路径
      - key: info_type
        title: 获取信息类型
        tip: 指定获取的信息类型
      - key: size_unit
        title: 文件大小单位
        tip: 仅在信息类型含大小时生效，默认B(字节)
    outputList:
      - key: file_info
        title: 文件信息为
        tip: 输出文件信息至变量，获取全部信息时数据类型为字典，获取其他信息时数据类型为字符串
  File.get_file_list:
    title: 获取文件列表
    comment: 获取指定目录 @{folder_path} 中的文件列表，并保存文件列表至变量 @{file_list}
    icon: get-file-list
    helpManual: 获取指定目录中的文件列表，并保存至输出变量
    inputList:
      - key: folder_path
        title: 文件目录
        tip: 选择或输入文件目录路径
      - key: traverse_subfolder
        title: 遍历子目录
        tip: 选择是否遍历子目录
      - key: tempfile_include
        title: 是否包含临时文件
        tip: 选择是否包含临时文件，例如~,~$开头或.tmp结尾的文件
      - key: output_type
        title: 输出方式
        tip: 设置输出方式
      - key: excel_path
        title: Excel保存目录
        tip: 选择或输入保存的Excel保存目录
      - key: state_type
        title: 目录不存在时
        tip: 选择Excel保存目录不存在时执行的操作
      - key: excel_name
        title: Excel文件名
        tip: 输入保存的Excel文件名，不需输入文件扩展名，默认扩展名为.xlsx
      - key: sort_method
        title: 排序方式
        tip: 指定排序方式
      - key: sort_type
        title: 排序类型
        tip: 指定排序类型
    outputList:
      - key: file_list
        title: 获取文件列表为
        tip: 输出获取到的文件列表到变量，数据类型为列表
  Folder.folder_exist:
    title: IF文件夹存在
    comment: 判断文件夹 @{folder_path}  @{exist_type}，存在就执行以下操作
    icon: check-folder-exists
    helpManual: 判断文件夹是否存在
    inputList:
      - key: folder_path
        title: 文件夹路径
        tip: 选择或输入文件夹路径
      - key: exist_type
        title: 判断类型
        tip: 设置判断类型
    outputList: []
  Folder.folder_open:
    title: 打开文件夹
    comment: 打开指定文件夹 @{folder_path}
    icon: open-folder
    helpManual: 打开指定文件夹
    inputList:
      - key: folder_path
        title: 文件夹路径
        tip: 选择或输入文件夹路径
    outputList: []
  Folder.folder_create:
    title: 创建文件夹
    comment: 在指定目录 @{target_path} 创建文件夹 @{folder_name} ，并保存新文件夹路径至变量 @{new_folder_path}
    icon: create-folder
