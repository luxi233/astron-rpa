    inputList: []
  System.save_custom_data:
    title: 保存自定义数据
    comment: 保存自定义数据 Key @{data_key}，持久保存跨流程执行可用
    icon: save-data
    helpManual: 持久保存用户自定义数据(同一应用内同Key覆盖，单条最大20000字符)，保存后可在任意流程中通过【读取自定义数据】读取，重启应用后数据仍保留
    inputList:
      - key: data_key
        title: 数据Key
        tip: 自定义数据的唯一标识，同Key保存会覆盖旧数据
      - key: content
        title: 数据内容
        tip: 要保存的数据内容，支持字符串，最大20000字符
  System.read_custom_data:
    title: 读取自定义数据
    comment: 读取自定义数据 Key @{data_key}，并保存至变量 @{content}
    icon: read-data
    helpManual: 读取通过【保存自定义数据】持久保存的数据，未保存过该Key时返回None
    inputList:
      - key: data_key
        title: 数据Key
        tip: 要读取的自定义数据Key
    outputList:
      - key: content
        title: 数据内容保存至
        tip: 输出读取到的数据内容并保存至变量，未保存过返回None
  System.terminate_app:
    title: 终止应用
    comment: 终止应用，停止整个应用的运行
    icon: terminate-app
    helpManual: 停止整个应用的运行，后续所有流程不再执行，应用以取消状态结束；适用于满足特定条件时提前结束应用的场景，常配合条件判断使用
    inputList: []
  System.get_app_param:
    title: 获取应用参数
    comment: 获取当前应用的 @{param_type}，并保存至变量 @{param_value}
    icon: get-app-param
    helpManual: 获取当前运行应用的参数信息，包括应用ID/应用名称/执行ID/资源文件目录，仅在应用执行环境中可用
    inputList:
      - key: param_type
        title: 参数类型
        tip: 选择要获取的应用参数类型
    outputList:
      - key: param_value
        title: 参数值保存至
        tip: 输出获取到的参数值并保存至变量
  System.read_resource_file:
    title: 读取资源文件内容
    comment: 读取资源文件 @{file_name} 的内容，并保存至变量 @{content}
    icon: read-resource
    helpManual: 读取资源目录中指定文件的内容，支持文本和二进制两种读取方式，资源目录为应用启动时指定的资源文件夹
    inputList:
      - key: file_name
        title: 资源文件名
        tip: 相对资源目录的文件名，支持子目录，如 test.txt 或 data/test.txt
      - key: read_type
        title: 读取类型
        tip: 选择文本或二进制方式读取
      - key: encode
        title: 文本编码
        tip: 文本读取时使用的编码，如utf-8/gbk
    outputList:
      - key: content
        title: 内容保存至
        tip: 输出文件内容并保存至变量，文本为字符串，二进制为字节数组
  System.get_resource_file_path:
    title: 获取资源文件路径
    comment: 获取资源文件 @{file_name} 的绝对路径，并保存至变量 @{file_path}
    icon: get-resource-path
    helpManual: 获取资源目录中指定文件的绝对路径，文件不存在时报错
    inputList:
      - key: file_name
        title: 资源文件名
        tip: 相对资源目录的文件名，支持子目录
    outputList:
      - key: file_path
        title: 路径保存至
        tip: 输出文件绝对路径并保存至变量
  System.copy_resource_file:
    title: 拷贝资源文件
    comment: 拷贝资源文件 @{file_name} 到 @{target_path}
    icon: copy-resource
    helpManual: 将资源目录中的指定文件拷贝到目标位置，可选择目标文件已存在时覆盖或不拷贝
    inputList:
      - key: file_name
        title: 资源文件名
        tip: 相对资源目录的文件名，支持子目录
      - key: target_path
        title: 拷贝到
        tip: 目标文件的完整路径
      - key: exist_option
        title: 目标文件已存在时
        tip: 选择覆盖原文件或不拷贝
  System.clipboard_resource_file:
    title: 将资源文件添加到剪切板
    comment: 将资源文件 @{file_name} 添加到剪切板
    icon: clipboard-resource
    helpManual: 将资源目录中的指定文件添加到剪切板，配合Ctrl+V可将文件粘贴到任意位置，适用于向无法直接指定路径的窗口传送文件
    inputList:
      - key: file_name
        title: 资源文件名
        tip: 相对资源目录的文件名，支持子目录
  System.export_log:
    title: 导出日志
    comment: 将运行日志导出到(@{folder_path})(@{file_name})
    icon: export-log
    helpManual: 将当前应用执行的「运行日志」内容导出到本地txt文件，日志包含执行过程中的用户日志、流程与异常信息
    inputList:
      - key: folder_path
        title: 文件夹路径
        tip: 导出日志文件的目标文件夹路径
      - key: file_name
        title: 文件名称
        tip: 导出的日志文件名称(.txt文件)
    outputList:
      - key: file_path
        title: 导出文件路径保存至
        tip: 输出导出文件的完整路径并保存至变量
  System.printer:
    title: 打印机打印
    comment: >-
      使用打印机 @{printer_name} 打印指定文件 @{file_path||folder_path} ，并保存执行结果至输出变量
      @{printer_status}
    icon: printer-print
    helpManual: 连接指定打印机进行文档打印
    inputList:
      - key: file_type
        title: 打印对象
        tip: 指定打印对象，支持打印Word、Excel、PDF和图片文件，或批量打印文件夹中文件
      - key: doc_app_type
        title: Word文档应用
        tip: 打开Word文档选择的应用
      - key: xls_app_type
        title: Excel文档应用
        tip: 打开Excel文档选择的应用
      - key: batch_print
        title: 打印方式
        tip: 设置打印方式，批量打印仅支持文件夹下的文件，不支持文件夹下文件夹的文件
      - key: file_path
        title: 待打印文件路径
        tip: 选择或输入待打印文件路径
      - key: folder_path
        title: 待打印文件目录
        tip: 选择或输入待打印文件目录，仅支持该文件夹下的文件，不包括文件夹下文件夹的文件，且文件类型满足打印对象类型，例如选择图片，仅会打印文件夹下的图片文件
      - key: printer_type
        title: 打印设置
        tip: 设置打印相关参数
      - key: printer_name
        title: 打印机名称
        tip: 输入打印机名称，为空时使用默认打印机
      - key: paper_size
        title: 纸张尺寸
        tip: 指定打印纸张尺寸
      - key: page_weight
        title: 纸张宽度
        tip: 输入打印纸张宽度
      - key: page_height
        title: 纸张高度
        tip: 输入打印纸张高度
      - key: print_num
        title: 打印份数
        tip: 输入打印份数，默认1份
      - key: orientation_type
        title: 打印版式
        tip: 选择打印版式，横向/纵向
      - key: scale
        title: 缩放(%)
        tip: 默认100%，输入缩放比例
      - key: margin_type
        title: 边距（单位毫米）
        tip: ''
      - key: left_margin
        title: 左边距
        tip: ''
      - key: top_margin
        title: 上边距
        tip: ''
      - key: right_margin
        title: 右边距
        tip: ''
      - key: bottom_margin
        title: 下边距
        tip: ''
      - key: page
        title: 页码范围
        tip: 例如：1,3-5 表示打印第1页和第3页到第5页的内容，留空表示打印全部页码
    outputList:
      - key: printer_status
        title: 打印结果
        tip: 保存打印结果到输出变量，数据类型为布尔值
  Printer.get_printer_list:
    title: 获取所有打印机列表
    comment: 获取系统所有本地和网络连接的打印机名称，保存至列表 @{printer_list}
    icon: printer-print
    helpManual: 返回已安装的打印机名称列表（含本地与网络连接的打印机）
    inputList: []
    outputList:
      - key: printer_list
        title: 打印机列表
        tip: 保存打印机名称列表到输出变量
  Printer.get_default_printer:
    title: 获取默认打印机
    comment: 获取系统默认打印机名称，保存至 @{printer_name}
    icon: printer-print
    helpManual: 返回当前系统默认打印机名称
    inputList: []
    outputList:
      - key: printer_name
        title: 打印机名称
        tip: 保存默认打印机名称到输出变量
  Printer.set_default_printer:
    title: 设置默认打印机
    comment: 将打印机 @{printer_name} 设置为系统默认打印机，执行结果保存至 @{success}
    icon: printer-print
    helpManual: 打印机名称须在已安装打印机列表中，可通过"获取所有打印机列表"查询
    inputList:
      - key: printer_name
        title: 打印机名称
        tip: 输入要设为默认的打印机名称
    outputList:
      - key: success
        title: 执行结果
        tip: 保存执行结果到输出变量，数据类型为布尔值
  Printer.get_printer_status:
    title: 获取打印机状态
    comment: 获取打印机 @{printer_name}(为空时取默认打印机) 的状态，状态码保存至 @{status_code}，状态描述保存至 @{status_text}
    icon: printer-print
    helpManual: 打印机名称为空时取默认打印机；状态码为0表示空闲，其余为各异常状态位组合（如卡纸/缺纸/脱机等）
    inputList:
      - key: printer_name
        title: 打印机名称
        tip: 输入打印机名称，为空时使用默认打印机
    outputList:
      - key: status_code
        title: 状态码
        tip: 保存打印机状态码到输出变量，0表示空闲
      - key: status_text
        title: 状态描述
        tip: 保存打印机状态中文描述到输出变量
  Printer.get_printer_jobs:
    title: 获取打印机工作队列
    comment: 获取打印机 @{printer_name}(为空时取默认打印机) 的打印作业列表，保存至 @{job_list}
    icon: printer-print
    helpManual: 打印机名称为空时取默认打印机；每项含作业ID/文档名/所有者/状态/已打印页数/总页数/提交时间，无作业时为空列表
    inputList:
      - key: printer_name
        title: 打印机名称
        tip: 输入打印机名称，为空时使用默认打印机
    outputList:
      - key: job_list
        title: 打印作业列表
        tip: 保存打印作业信息列表到输出变量
  Printer.clear_printer_jobs:
    title: 清空打印机队列
    comment: 清空打印机 @{printer_name}(为空时取默认打印机) 队列中所有打印作业，执行结果保存至 @{success}
    icon: printer-print
    helpManual: 打印机名称为空时取默认打印机；清空后队列中的作业将不再打印
    inputList:
      - key: printer_name
        title: 打印机名称
        tip: 输入打印机名称，为空时使用默认打印机
    outputList:
      - key: success
        title: 执行结果
        tip: 保存执行结果到输出变量，数据类型为布尔值
  Screen.get_screen_resolution:
    title: 获取屏幕分辨率
    comment: 获取主屏幕分辨率，宽保存至 @{width}，高保存至 @{height}，缩放百分比保存至 @{scale}
    icon: system-check
    helpManual: 返回主屏幕物理分辨率（像素）与系统缩放百分比（100=100%）；多显示器时取主屏幕
    inputList: []
    outputList:
      - key: width
        title: 宽(像素)
        tip: 保存屏幕宽度到输出变量
      - key: height
        title: 高(像素)
        tip: 保存屏幕高度到输出变量
      - key: scale
        title: 缩放(%)
        tip: 保存系统缩放百分比到输出变量，100表示100%
  Screen.set_screen_resolution:
    title: 设置屏幕分辨率
    comment: 将主屏幕分辨率设置为 @{width} x @{height}（颜色位数 @{color_bits}，默认32位），执行结果保存至 @{success}
    icon: system-check
    helpManual: 宽高为像素值，颜色位数默认32位；分辨率须为显示器与显卡支持的组合，否则执行失败
    inputList:
      - key: width
        title: 宽(像素)
        tip: 输入目标分辨率宽度，如1920
      - key: height
        title: 高(像素)
        tip: 输入目标分辨率高度，如1080
      - key: color_bits
        title: 颜色位数
        tip: 默认32位真彩色
    outputList:
      - key: success
        title: 执行结果
        tip: 保存执行结果到输出变量，数据类型为布尔值
  Screen.set_screen_scale:
    title: 设置屏幕缩放
    comment: 将系统缩放设置为 @{scale}%，执行结果保存至 @{success}
    icon: system-check
    helpManual: 缩放百分比须为100-500且为25的倍数；修改注册表实现，注销并重新登录后生效
    inputList:
      - key: scale
        title: 缩放(%)
        tip: 输入缩放百分比，如100/125/150/200
    outputList:
      - key: success
        title: 执行结果
        tip: 保存执行结果到输出变量，数据类型为布尔值
  Device.get_ip_address:
    title: 获取本地IP地址
    comment: 获取本地计算机的IP地址保存至 @{ip_address}，计算机名保存至 @{host_name}
    icon: system-check
    helpManual: 通过计算机名解析本机IP；多网卡/虚拟网卡场景可能返回其中一个地址
    inputList: []
    outputList:
      - key: ip_address
        title: IP地址
        tip: 保存本机IP地址到输出变量
      - key: host_name
        title: 计算机名
        tip: 保存本机计算机名到输出变量
  Device.get_computer_info:
    title: 获取计算机信息
    comment: 获取计算机信息，名称保存至 @{computer_name}，操作系统版本保存至 @{os_version}，处理器保存至 @{processor}，系统目录保存至 @{system_dir}，位数保存至 @{arch_bits}
    icon: system-check
    helpManual: 返回计算机名称/操作系统版本/处理器/系统目录/系统位数（如64bit）
    inputList: []
    outputList:
      - key: computer_name
        title: 计算机名称
        tip: 保存计算机名称到输出变量
      - key: os_version
        title: 操作系统版本
        tip: 保存操作系统版本到输出变量
      - key: processor
        title: 处理器
        tip: 保存处理器信息到输出变量
      - key: system_dir
        title: 系统目录
        tip: 保存系统目录到输出变量
      - key: arch_bits
        title: 系统位数
        tip: 保存系统位数到输出变量，如64bit
  Device.show_desktop:
    title: 显示桌面
    comment: 最小化所有窗口，显示桌面
    icon: system-check
    helpManual: 等效于按下 Win+D 组合键，最小化当前所有窗口；再次执行不会恢复窗口
    inputList: []
    outputList: []
  Device.play_sound:
    title: 播放声音
    comment: 播放频率 @{frequency} 赫兹、时长 @{duration} 毫秒的蜂鸣声
    icon: system-check
    helpManual: 频率须在37-32767赫兹之间，时长单位为毫秒；通过系统扬声器播放蜂鸣提示音
    inputList:
      - key: frequency
        title: 频率(赫兹)
        tip: 输入蜂鸣频率，如1000
      - key: duration
        title: 时长(毫秒)
        tip: 输入播放时长，如500
    outputList: []
  Device.empty_recycle_bin:
    title: 清空回收站
    comment: 清空回收站中所有文件，执行结果保存至 @{success}
    icon: system-check
    helpManual: 直接清空回收站所有内容，不弹出确认对话框，操作不可恢复，请谨慎使用
    inputList: []
    outputList:
      - key: success
        title: 执行结果
        tip: 保存执行结果到输出变量，数据类型为布尔值
  Assert.assert_condition:
    title: 条件断言
    comment: 断言(@{value1})(@{operator})(@{value2})，失败时中断流程
    icon: system-check
    helpManual: 判断对象1与对象2的关系是否成立，断言失败时抛出异常并中断流程；支持等于/不等于/大于/大于等于/小于/小于等于/包含/不包含
    inputList:
      - key: value1
        title: 对象1
        tip: 待断言的对象1(支持任意类型)
      - key: operator
        title: 运算符
        tip: 选择断言的运算符
      - key: value2
        title: 对象2
        tip: 待断言的对象2(支持任意类型)
      - key: error_message
        title: 自定义错误信息
        tip: 断言失败时抛出的错误信息(不填使用默认信息)
  Assert.assert_empty:
    title: 空值断言
    comment: 断言(@{value})为空或不为空，失败时中断流程
    icon: system-check
    helpManual: 判断值是否为空(None/空字符串/空列表)，断言失败时抛出异常并中断流程；勾选【空白字符串视为空】后，纯空格字符串也视为空
    inputList:
      - key: value
        title: 待判断的值
        tip: 支持任意类型
      - key: assert_mode
        title: 断言模式
        tip: 断言不为空/断言为空
      - key: include_whitespace
        title: 空白字符串视为空
        tip: 勾选后纯空格字符串(如"  ")也视为空
      - key: error_message
        title: 自定义错误信息
        tip: 断言失败时抛出的错误信息(不填使用默认信息)
  Assert.assert_file_folder:
    title: 文件/文件夹断言
    comment: 断言(@{path})存在或不存在，失败时中断流程
    icon: system-check
    helpManual: 判断文件/文件夹是否存在，断言失败时抛出异常并中断流程
    inputList:
      - key: path
        title: 文件/文件夹路径
        tip: 待断言的文件或文件夹路径
      - key: target_type
        title: 目标类型
        tip: 文件/文件夹/文件或文件夹
      - key: exist_mode
        title: 断言模式
        tip: 存在/不存在
      - key: error_message
        title: 自定义错误信息
        tip: 断言失败时抛出的错误信息(不填使用默认信息)
options:
  AssertOperator:
    - value: eq
      label: 等于
    - value: neq
      label: 不等于
    - value: gt
      label: 大于
    - value: gte
      label: 大于等于
    - value: lt
      label: 小于
    - value: lte
      label: 小于等于
    - value: contains
      label: 包含
    - value: not_contains
      label: 不包含
  AssertEmptyMode:
    - value: not_empty
      label: 断言不为空
    - value: empty
      label: 断言为空
  AssertTargetType:
    - value: file
      label: 文件
    - value: folder
      label: 文件夹
    - value: any
      label: 文件或文件夹
  ContentType:
    - value: msg
      label: 文本内容
    - value: html
      label: HTML格式文本内容
    - value: file
      label: 文件
    - value: folder
      label: 文件夹
  StateType:
    - value: create
      label: 创建
    - value: error
      label: 提示并报错
  FileFolderType:
