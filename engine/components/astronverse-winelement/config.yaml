atomic:
  WinEle.click_element:
    title: 点击元素（桌面）
    comment: '@{click_type} 拾取到的元素 @{pick} ，最长等待 @{wait_time} 秒直到此元素出现'
    icon: click-element-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: click_button
        title: 点击按钮
        tip: ''
      - key: click_type
        title: 点击类型
        tip: ''
      - key: wait_time
        title: 等待元素出现时间
        tip: ''
      - key: horizontals_offset
        title: 横向偏移量
        tip: ''
      - key: verticals_offset
        title: 纵向偏移量
        tip: ''
      - key: keyboard_input
        title: 键盘辅助输入
        tip: 点击时同时按下键盘上的某些键
    outputList: []
  WinEle.screenshot_element:
    title: 元素截图（桌面）
    comment: 截图拾取到的元素 @{pick} ，并保存至文件夹 @{file_path}
    icon: element-screenshot-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: file_path
        title: 文件保存路径
        tip: ''
      - key: file_name
        title: 文件名
        tip: ''
      - key: exist_type
        title: 文件同名时处理方式
        tip: ''
    outputList: []
  WinEle.hover_element:
    title: 鼠标悬停元素（桌面）
    comment: 鼠标悬停拾取到的元素 @{pick} ，并设置等待时间 @{wait_time} 秒
    icon: mouse-hover-element-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: wait_time
        title: 等待元素出现时间
        tip: ''
    outputList: []
  WinEle.input_text_element:
    title: 填写输入框（桌面）
    comment: 填写输入框 @{pick} ，并设置输入类型为 @{input_type} ，输入内容为 @{text}
    icon: fill-input-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: input_type
        title: 输入类型
        tip: ''
      - key: text
        title: 输入内容
        tip: ''
      - key: credential_text
        title: 选择凭据
        tip: ''
      - key: clear_first
        title: 是否清空输入框内容
        tip: ''
      - key: wait_time
        title: 等待元素出现时间
        tip: ''
    outputList: []
  WinEle.get_element_text:
    title: 获取元素文本（桌面）
    comment: 从元素 @{pick} 提取文本并保存到 @{ele_text}
    icon: get-element-text-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: wait_time
        title: 等待元素出现时间
        tip: ''
    outputList:
      - key: ele_text
        title: 元素文本
        tip: ''
  WinEle.similar:
    title: 获取相似元素列表（桌面）
    comment: 获取拾取到的元素 @{pick} 相似的元素（@{get_type}），并将相似元素数组输出至 @{get_similar_ele}，相似元素个数为@{similar_count}
    icon: get-similar-elements-win
    helpManual: 获取桌面窗口中与拾取元素相似的元素列表。支持获取元素对象（可继续点击、悬停等）、获取元素文本内容、获取元素值、获取元素属性四种操作类型
    inputList:
      - key: pick
        title: 相识元素拾取
        tip: 在桌面上拾取不同位置的两个相似元素
      - key: get_type
        title: 元素操作
        tip: 选择对每个相似元素执行的操作
      - key: attribute_name
        title: 属性名称
        tip: 元素操作为获取元素属性时填写，如index(位置)、Name、AutomationId、ClassName、ControlTypeName
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: get_similar_ele
        title: 元素信息
        tip: ''
      - key: similar_count
        title: 相似元素个数
        tip: 获取到的相似元素列表项个数
  WinEle.contain_element:
    title: IF窗口包含元素
    comment: 当前窗口中是否@{check_type}元素 @{pick}
    icon: check-window-exists
    helpManual: 判断指定窗口中是否包含拾取的元素。常用于判断窗口内容加载完成、弹窗出现等场景
    inputList:
      - key: pick
        title: 元素拾取
        tip: 拾取需要判断的窗口元素
      - key: check_type
        title: 判断方式
        tip: 选择窗口包含或不包含该元素时进入执行
      - key: wait_time
        title: 超时时间(秒)
        tip: 在该时间内持续检测，默认10秒
    outputList: []
  WinEle.loop_similar:
    title: 循环相似元素列表（win）
    comment: 获取与拾取元素 @{pick} 相似的窗口元素（@{get_type}），从起始项@{start}到结束项@{end}进行循环操作，输出循环项至@{item}，循环项位置为@{index}
    icon: get-similar-elements-win
    helpManual: 依次循环窗口中相似元素列表的每一项进行自动化操作。支持获取元素对象（可继续点击、悬停等）、获取元素文本内容、获取元素值、获取元素属性四种操作类型
    inputList:
      - key: pick
        title: 相似元素拾取
        tip: 在窗口上拾取相似元素
      - key: get_type
        title: 元素操作
        tip: 选择循环时对每个相似元素执行的操作
      - key: attribute_name
        title: 属性名称
        tip: 元素操作为获取元素属性时填写，如index(位置)、Name、AutomationId、ClassName、ControlTypeName
      - key: start
        title: 起始位置
        tip: 下标位置从0开始
      - key: end
        title: 结束位置
        tip: 下标位置从0开始，-1代表循环至最后一个元素
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: index
        title: 循环项位置
        tip: 默认变量可修改，用于遍历列表的变量索引数值
      - key: item
        title: 循环项
        tip: 默认变量可修改，用于遍历列表的变量
  WinEle.set_select:
    title: 设置下拉框（桌面）
    comment: 设置下拉框元素 @{pick} ，通过@{select_type}选择选项
    icon: fill-input-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: select_type
        title: 选择方式
        tip: 按选项内容或选项位置选择
      - key: item_text
        title: 选项内容
        tip: 按选项内容选择时填写，支持模糊匹配
      - key: item_index
        title: 选项位置
        tip: 按选项位置选择时填写，从1开始
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList: []
  WinEle.set_checked:
    title: 设置复选框（桌面）
    comment: '设置复选框元素 @{pick} ，操作方式为 @{check_type}'
    icon: click-element-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: check_type
        title: 操作方式
        tip: 勾选、取消勾选或反选
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList: []
  WinEle.set_value:
    title: 设置元素值（桌面）
    comment: 通过UIA接口直接设置元素 @{pick} 的值为 @{value} ，一般用于输入框和下拉框
    icon: fill-input-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: value
        title: 元素值
        tip: 设置到元素上的值
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList: []
  WinEle.wait_element:
    title: 等待元素（桌面）
    comment: 等待元素 @{pick} (@{wait_type})，最长等待 @{wait_time} 秒，结果保存至 @{wait_result}
    icon: check-window-exists
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: wait_type
        title: 等待方式
        tip: 等待元素出现或消失
      - key: wait_time
        title: 等待时间（秒）
        tip: 在该时间内持续检测
    outputList:
      - key: wait_result
        title: 等待结果
        tip: true表示等待成功，false表示超时
  WinEle.get_element_info:
    title: 获取元素信息（桌面）
    comment: 获取元素 @{pick} 的信息（@{info_type}），保存至 @{ele_info}
    icon: get-element-text-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: info_type
        title: 信息类型
        tip: 获取元素文本、值或属性
      - key: attribute_name
        title: 属性名称
        tip: 信息类型为获取元素属性时填写，如Name、AutomationId、ClassName、ControlTypeName
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: ele_info
        title: 元素信息
        tip: ''
  WinEle.get_element_position:
    title: 获取元素位置（桌面）
    comment: 获取元素 @{pick} 相对@{relative_to}的位置信息
    icon: get-element-text-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: relative_to
        title: 参照物
        tip: 相对屏幕或元素所在窗口左上角
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: pos_left
        title: 左边距
        tip: 元素左上角横坐标
      - key: pos_top
        title: 上边距
        tip: 元素左上角纵坐标
      - key: pos_width
        title: 宽度
        tip: 元素宽度（像素）
      - key: pos_height
        title: 高度
        tip: 元素高度（像素）
      - key: center_x
        title: 中心点横坐标
        tip: 元素中心点横坐标
      - key: center_y
        title: 中心点纵坐标
        tip: 元素中心点纵坐标
  WinEle.get_relative_element:
    title: 获取关联元素（桌面）
    comment: 获取元素 @{pick} 的@{relative_type}，保存至 @{relative_ele}
    icon: get-similar-elements-win
    helpManual: ''
    inputList:
      - key: pick
        title: 元素拾取
        tip: ''
      - key: relative_type
        title: 关联方式
        tip: 父元素、子元素或同级元素
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: relative_ele
        title: 关联元素
        tip: 获取到的元素对象，可供其他桌面元素指令使用
  WinEle.drag_element:
    title: 拖拽元素（桌面）
    comment: 将元素 @{pick} 拖拽至@{drag_type}
    icon: click-element-win
    helpManual: ''
    inputList:
      - key: pick
        title: 起始元素拾取
        tip: 拾取需要拖拽的元素
      - key: drag_type
        title: 拖拽方式
        tip: 拖拽至目标元素或目标点偏移量
      - key: pick_to
        title: 目标元素拾取
        tip: 拖拽方式为目标元素时拾取拖拽目标
      - key: offset_x
        title: 横向偏移量
        tip: 拖拽方式为目标点时填写，相对元素中心点的横向偏移
      - key: offset_y
        title: 纵向偏移量
        tip: 拖拽方式为目标点时填写，相对元素中心点的纵向偏移
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList: []
  WinEle.wait_any_element:
    title: 等待任意一个元素出现（桌面）
    comment: 等待元素(@{pick_1}/@{pick_2}/@{pick_3}/@{pick_4}/@{pick_5})任意一个出现，最长等待 @{wait_time} 秒，命中名称保存至 @{hit_element_name}
    icon: check-window-exists
    helpManual: 同时等待多个桌面元素，任意一个出现即返回并输出其名称；超时返回false，常用于分支窗口的场景判断
    inputList:
      - key: pick_1
        title: 元素1拾取
        tip: 拾取第1个候选元素
      - key: name_1
        title: 元素1名称
        tip: 元素1出现时输出的名称(默认"元素1")
      - key: pick_2
        title: 元素2拾取
        tip: 拾取第2个候选元素(可选)
      - key: name_2
        title: 元素2名称
        tip: 元素2出现时输出的名称(默认"元素2")
      - key: pick_3
        title: 元素3拾取
        tip: 拾取第3个候选元素(可选)
      - key: name_3
        title: 元素3名称
        tip: 元素3出现时输出的名称(默认"元素3")
      - key: pick_4
        title: 元素4拾取
        tip: 拾取第4个候选元素(可选)
      - key: name_4
        title: 元素4名称
        tip: 元素4出现时输出的名称(默认"元素4")
      - key: pick_5
        title: 元素5拾取
        tip: 拾取第5个候选元素(可选)
      - key: name_5
        title: 元素5名称
        tip: 元素5出现时输出的名称(默认"元素5")
      - key: wait_time
        title: 等待时间（秒）
        tip: 在该时间内持续检测
    outputList:
      - key: hit_element_name
        title: 命中元素名称保存至
        tip: 最先出现的元素名称，超时为空字符串
      - key: wait_result
        title: 等待结果保存至
        tip: true表示有元素出现，false表示超时
  WinEle.wait_any_group:
    title: 等待任意一组元素出现（桌面）
    comment: 等待(@{group_a_name}或@{group_b_name})任意一组元素全部出现，最长等待 @{wait_time} 秒，命中组名保存至 @{hit_group_name}
    icon: check-window-exists
    helpManual: 配置两组元素(A/B)，组内全部元素出现即该组命中；常用于多元素共同标识一个窗口状态的场景
    inputList:
      - key: group_a_name
        title: A组名称
        tip: A组命中时输出的名称(默认"组A")
      - key: pick_a_1
        title: A组元素1拾取
        tip: 拾取A组第1个元素
      - key: pick_a_2
        title: A组元素2拾取
        tip: 拾取A组第2个元素(可选)
      - key: pick_a_3
        title: A组元素3拾取
        tip: 拾取A组第3个元素(可选)
      - key: group_b_name
        title: B组名称
        tip: B组命中时输出的名称(默认"组B")
      - key: pick_b_1
        title: B组元素1拾取
        tip: 拾取B组第1个元素
      - key: pick_b_2
        title: B组元素2拾取
        tip: 拾取B组第2个元素(可选)
      - key: pick_b_3
        title: B组元素3拾取
        tip: 拾取B组第3个元素(可选)
      - key: wait_time
        title: 等待时间（秒）
        tip: 在该时间内持续检测
    outputList:
      - key: hit_group_name
        title: 命中组名保存至
        tip: 最先全部出现的组名，超时为空字符串
      - key: wait_result
        title: 等待结果保存至
        tip: true表示有组命中，false表示超时
  WinEle.combine_elements:
    title: 组合多元素（桌面）
    comment: 将拾取的多个元素(@{pick_1}~@{pick_5})合成一个元素列表，保存至 @{picks}
    icon: get-similar-elements-win
    helpManual: 将最多5个拾取的桌面元素组合成元素列表(含数量)，供循环遍历或批量操作使用
    inputList:
      - key: pick_1
        title: 元素1拾取
        tip: 拾取第1个元素
      - key: pick_2
        title: 元素2拾取
        tip: 拾取第2个元素(可选)
      - key: pick_3
        title: 元素3拾取
        tip: 拾取第3个元素(可选)
      - key: pick_4
        title: 元素4拾取
        tip: 拾取第4个元素(可选)
      - key: pick_5
        title: 元素5拾取
        tip: 拾取第5个元素(可选)
    outputList:
      - key: picks
        title: 元素列表保存至
        tip: 组合后的桌面元素对象列表
      - key: pick_count
        title: 元素数量保存至
        tip: 列表中的元素个数
  WinEle.get_all_attributes:
    title: 获取元素全部属性（桌面）
    comment: 采集元素 @{pick} 的全部常用属性，以字典保存至 @{attributes}
    icon: get-element-text-win
    helpManual: 采集元素常用UIA属性(Name/ClassName/ControlTypeName/AutomationId/位置矩形/值等)为字典，便于调试和属性名查找
    inputList:
      - key: pick
        title: 元素拾取
        tip: 拾取目标元素
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: attributes
        title: 属性字典保存至
        tip: 元素全部常用属性的字典
      - key: attribute_count
        title: 属性数量保存至
        tip: 字典中的属性个数
  WinEle.get_all_text:
    title: 获取元素所有文本（桌面）
    comment: 递归收集元素 @{pick} 及其子孙的全部文本，合并保存至 @{all_text}
    icon: get-element-text-win
    helpManual: 递归遍历元素及其全部子孙元素，收集非空文本；输出合并文本(可设分隔符)、文本列表和数量
    inputList:
      - key: pick
        title: 元素拾取
        tip: 拾取目标元素(通常拾取容器)
      - key: separator
        title: 合并分隔符
        tip: 合并文本时使用的分隔符，默认换行
      - key: include_self
        title: 包含元素自身文本
        tip: 是否包含拾取元素自身的文本
      - key: max_depth
        title: 最大递归深度
        tip: 子孙遍历最大层级，默认20
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: all_text
        title: 合并文本保存至
        tip: 按分隔符合并的全部文本
      - key: text_list
        title: 文本列表保存至
        tip: 各元素文本组成的列表
      - key: text_count
        title: 文本数量保存至
        tip: 文本列表的项数
  WinEle.batch_scrape:
    title: 批量数据抓取（桌面）
    comment: 按相似元素 @{pick} 逐行抓取子孙文本，二维列表保存至 @{data_table}
    icon: get-similar-elements-win
    helpManual: 拾取一行数据作为模板(相似元素)，每个命中元素为一行，行内递归抓取子孙文本为列，输出二维列表；适用于列表/表格类界面数据采集
    inputList:
      - key: pick
        title: 行模板元素拾取
        tip: 拾取一行数据作为模板(相似元素)
      - key: include_self_text
        title: 行包含自身文本
        tip: 行数据是否包含模板元素自身的文本
      - key: max_depth
        title: 最大递归深度
        tip: 行内子孙遍历最大层级，默认10
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList:
      - key: data_table
        title: 数据二维列表保存至
        tip: 每行为一个相似元素的子孙文本列表
      - key: row_count
        title: 行数保存至
        tip: 抓取到的数据行数
  WinEle.scroll_into_view:
    title: 显示指定元素（桌面）
    comment: 将元素 @{pick} 滚动到可视区域(@{auto_click})
    icon: click-element-win
    helpManual: 通过ScrollItemPattern将元素滚动到可视区域(逐级向上寻找可滚动祖先)；可选滚动后自动点击元素
    inputList:
      - key: pick
        title: 元素拾取
        tip: 拾取需要显示的目标元素
      - key: auto_click
        title: 自动点击
        tip: 滚动显示后是否自动点击该元素
      - key: max_ancestor
        title: 最大向上查找层数
        tip: 向上寻找可滚动祖先的最大层级，默认10
      - key: wait_time
        title: 等待元素出现时间（秒）
        tip: 超过该时间停止等待
    outputList: []
options:
