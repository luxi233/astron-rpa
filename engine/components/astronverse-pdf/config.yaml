atomic:
  PDF.get_pages_num:
    title: 获取PDF文档页数
    comment: 获取路径为 @{file_path} 的PDF文档页数 @{pdf_pages_num}
    icon: pdf-get-page-count
    helpManual: ''
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: 输入PDF文件路径
      - key: password
        title: PDF文件密码
        tip: 输入PDF文件密码，如果没有密码则留空
    outputList:
      - key: pdf_pages_num
        title: PDF文档页数
        tip: 返回PDF文档页数
  PDF.get_pdf_text:
    title: 提取PDF文档文本
    comment: 提取路径为 @{file_path} 的PDF文档文本，返回为字符串或列表 @{pdf_text}
    icon: pdf-extract-text
    helpManual: ''
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: 输入PDF文件路径
      - key: password
        title: PDF文件密码
        tip: 输入PDF文件密码，如果没有密码则留空
      - key: select_range
        title: 选择范围
        tip: 选择范围，支持全部页面和指定页面范围
      - key: page_range
        title: 指定页面范围
        tip: 输入页面范围，格式为1-3,5,7-9,11，表示从1到3页，5页，7到9页，11页
      - key: text_save_type
        title: 是否保存为文件
        tip: 选择是否保存提取的文本为文件，可保存为Word或文本文件格式
      - key: save_dir
        title: 保存文件路径
        tip: 选择保存文件的文件夹路径
      - key: save_file_name
        title: 保存文件名
        tip: 输入保存文件名，不输入则使用默认文件名
      - key: exist_handle_type
        title: 存在同名文件处理方式
        tip: 选择存在文件处理方式，支持覆盖原有文件、创建文件副本、跳过保存操作
    outputList:
      - key: pdf_text
        title: 提取的PDF文档文本
        tip: 提取的PDF文档文本，以列表形式存储返回
  PDF.get_pdf_images:
    title: 提取PDF文档图片
    comment: 提取路径为 @{file_path} 的PDF文档图片，并保存到 @{save_dir} 文件夹
    icon: pdf-extract-images
    helpManual: ''
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: pwd
        title: PDF文件密码
        tip: 如果PDF文件需要密码，请输入密码，否则留空
      - key: select_range
        title: 选择范围
        tip: 选择范围，支持全部页面和指定页面范围
      - key: page_range
        title: 指定页面范围
        tip: 输入页面范围，格式为1-3,5,7-9,11，表示从1到3页，5页，7到9页，11页
      - key: image_type
        title: 图片格式
        tip: 选择图片格式，支持JPEG、PNG等格式
      - key: save_dir
        title: 保存文件路径
        tip: 选择保存文件的文件夹路径
      - key: prefix
        title: 图片文件名前缀
        tip: 输入图片文件名前缀，不输入则使用原文件名前缀
      - key: exist_handle_type
        title: 存在同名文件处理方式
        tip: 选择存在文件处理方式，支持覆盖原有文件、创建文件副本、跳过保存操作
    outputList: []
  PDF.merge_pdf_files:
    title: 合并PDF文件
    comment: 合并PDF文件为一个PDF文件，并保存到 @{pdf_merge_file_path} 路径
    icon: merge-pdf-files
    helpManual: ''
    inputList:
      - key: merge_type
        title: 合并方式
        tip: 选择合并方式，支持按文件夹合并或按文件合并
      - key: file_folder_path
        title: 合并文件夹
        tip: 将会合并文件夹中所有的PDF文件
      - key: files_path
        title: 合并文件
        tip: 将会合并所选的所有PDF文件
      - key: save_dir
        title: 保存文件路径
        tip: 选择保存文件的文件夹路径
      - key: new_file_name
        title: 合并文件名
        tip: 输入合并文件名，不输入则使用默认文件名
      - key: new_pwd_flag
        title: 是否给新PDF文件设置密码
        tip: 选择是否设置密码
      - key: new_pwd
        title: 新PDF文件密码
        tip: 输入新PDF文件密码
      - key: exist_handle_type
        title: 存在同名文件处理方式
        tip: 选择存在文件处理方式，支持覆盖原有文件、创建文件副本、跳过保存操作
    outputList:
      - key: pdf_merge_file_path
        title: 合并后的PDF文件路径
        tip: 合并后的PDF文件路径
  PDF.extract_pdf_file:
    title: 抽取PDF指定页
    comment: 抽取路径为 @{file_path} 的PDF文档指定页，并保存到 @{extract_file_path} 文件夹
    icon: pdf-extract-page
    helpManual: ''
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: 选择需要抽取的PDF文件路径
      - key: pwd
        title: PDF文件密码
        tip: 如果PDF文件需要密码，请输入密码，否则留空
      - key: page_range
        title: 指定页面范围
        tip: 输入页面范围，格式为1-3,5,7-9,11，表示从1到3页，5页，7到9页，11页
      - key: save_dir
        title: 保存文件路径
        tip: 选择保存文件的文件夹路径
      - key: new_file_name
        title: 抽取后新PDF文件名
        tip: 输入新文件名，不输入则使用默认文件名
      - key: new_pwd_flag
        title: 是否给新PDF文件设置密码
        tip: 选择是否设置密码
      - key: new_pwd
        title: 新PDF文件密码
        tip: 输入新PDF文件密码
      - key: exist_handle_type
        title: 存在同名文件处理方式
        tip: 选择存在文件处理方式，支持覆盖原有文件、创建文件副本、跳过保存操作
    outputList:
      - key: extract_file_path
        title: 提取后的PDF文件路径
        tip: 提取后的PDF文件路径
  PDF.extract_forms_from_pdf:
    title: 提取PDF表格到Excel
    comment: 提取路径为 @{file_path} 的PDF文档中的表格，并保存到 @{forms_file_path} 文件夹
    icon: pdf-extract-table-to-excel
    helpManual: ''
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: 选择需要提取表格的PDF文件路径
      - key: pwd
        title: PDF文件密码
        tip: 如果PDF文件需要密码，请输入密码，否则留空
      - key: select_range
        title: 选择范围
        tip: 选择范围，支持全部页面和指定页面范围
      - key: page_range
        title: 指定页面范围
        tip: 输入页面范围，格式为1-3,5,7-9,11，表示从1到3页，5页，7到9页，11页
      - key: combine_flag
        title: 是否需要合并多个表格
        tip: 当出现跨页的表格时，可以选择是否合并成一个表格，建议表头相同时选择合并
      - key: save_dir
        title: 保存文件路径
        tip: 选择保存文件的文件夹路径
      - key: new_file_name
        title: 表格文件名
        tip: 输入表格文件名，不输入则使用默认文件名
      - key: exist_handle_type
        title: 存在同名文件处理方式
        tip: 选择存在文件处理方式，支持覆盖原有文件、创建文件副本、跳过保存操作
    outputList:
      - key: forms_file_path
        title: 提取后的Excel路径
        tip: 提取后的Excel路径
  PDF.convert_pdf_to_img:
    title: PDF页面转图片
    comment: 转换路径为 @{file_path} 的PDF文档为图片，并保存到 @{save_dir} 文件夹
    icon: pdf-page-to-image
    helpManual: ''
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: 选择需要转换的PDF文件路径
      - key: pwd
        title: PDF文件密码
        tip: 如果PDF文件需要密码，请输入密码，否则留空
      - key: image_type
        title: 图片格式
        tip: 选择图片格式，支持JPEG、PNG等格式
      - key: select_range
        title: 选择范围
        tip: 选择范围，支持全部页面和指定页面范围
      - key: page_range
        title: 指定页面范围
        tip: 输入页面范围，格式为1-3,5,7-9,11，表示从1到3页，5页，7到9页，11页
      - key: save_dir
        title: 保存文件路径
        tip: 选择保存文件的文件夹路径
      - key: prefix
        title: 图片文件名前缀
        tip: 输入图片文件名前缀，不输入则使用原文件名前缀
      - key: exist_handle_type
        title: 存在同名文件处理方式
        tip: 选择存在文件处理方式，支持覆盖原有文件、创建文件副本、跳过保存操作
    outputList: []
  PDF.convert_img_to_pdf:
    title: 图片转PDF页面
    comment: 转换路径为 @{image_files} 的图片为PDF文件，并保存到 @{save_dir} 文件夹
    icon: pdf-page-to-image
    helpManual: ''
    inputList:
      - key: image_files
        title: 图片文件
        tip: ''
      - key: save_dir
        title: 保存PDF文件路径
        tip: ''
      - key: new_file_name
        title: PDF文件名
        tip: ''
      - key: layout_type
        title: PDF文件布局
        tip: ''
      - key: new_pwd_flag
        title: 是否设置密码
        tip: ''
      - key: new_pwd
        title: 密码
        tip: ''
      - key: exist_handle_type
        title: 存在同名文件处理方式
        tip: ''
    outputList:
      - key: pdf_file_path
        title: PDF文件路径
        tip: ''
  PDFExt.extract_table_spacing:
    title: 提取PDF表格(按文本间距)
    comment: 按文本间距启发式提取路径为 @{file_path} 的PDF表格（无线框表格），输出至变量 @{tables}
    icon: atom-default
    helpManual: 适合无线框表格；输出为二维列表的列表（每个表格为多行多列）；页码范围格式为1,3,5-7，负数表示倒数（-1为最后一页）
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
      - key: page_range
        title: 页码范围
        tip: 留空为全部页面，格式为1,3,5-7
    outputList:
      - key: tables
        title: 表格内容列表
        tip: 二维列表的列表，每个表格为多行多列
  PDFExt.extract_table_lines:
    title: 提取PDF表格(按表格线)
    comment: 按表格线提取路径为 @{file_path} 的PDF表格（有线框/横线的表格），输出至变量 @{tables}
    icon: atom-default
    helpManual: 适合有线框或横线的表格；输出为二维列表的列表；页码范围格式为1,3,5-7，负数表示倒数
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
      - key: page_range
        title: 页码范围
        tip: 留空为全部页面，格式为1,3,5-7
    outputList:
      - key: tables
        title: 表格内容列表
        tip: 二维列表的列表，每个表格为多行多列
  PDFExt.get_pdf_table:
    title: 获取PDF表格(自动)
    comment: 自动提取路径为 @{file_path} 的PDF表格（优先按表格线，无线时按文本间距），输出至变量 @{tables}
    icon: atom-default
    helpManual: 自动策略先按线提取，提取不到时回退文本间距启发式；页码范围格式为1,3,5-7，负数表示倒数（-1为最后一页）
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
      - key: page_range
        title: 页码范围
        tip: 留空为全部页面，格式为1,3,5-7
    outputList:
      - key: tables
        title: 表格内容列表
        tip: 二维列表的列表，每个表格为多行多列
  PDFExt.extract_region_text:
    title: 提取PDF区域文本
    comment: 提取路径为 @{file_path} 第 @{page_number} 页区域(左 @{x0} 上 @{top} 右 @{x1} 下 @{bottom})内的文字，输出至变量 @{region_text}
    icon: atom-default
    helpManual: 坐标为pt磅、以页面左上角为原点；可用"获取PDF页面尺寸"原子取得页面宽高辅助定位
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: x0
        title: 左边界x(pt)
        tip: 区域左上角x坐标
      - key: top
        title: 上边界y(pt)
        tip: 区域左上角y坐标
      - key: x1
        title: 右边界x(pt)
        tip: 区域右下角x坐标
      - key: bottom
        title: 下边界y(pt)
        tip: 区域右下角y坐标
      - key: page_number
        title: 页码
        tip: 默认第1页
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
    outputList:
      - key: region_text
        title: 区域文本
        tip: 区域内提取的文本
  PDFExt.get_typed_regions:
    title: 获取PDF区域列表
    comment: 获取路径为 @{file_path} 中类型为 @{region_type} 的区域列表，输出至变量 @{regions}
    icon: atom-default
    helpManual: 每项含页码、bbox坐标(x0,y0,x1,y1，左上原点pt)与内容；文本块含text、图片含name、表格含cells单元格数
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: region_type
        title: 区域类型
        tip: ''
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
      - key: page_range
        title: 页码范围
        tip: 留空为全部页面，格式为1,3,5-7
    outputList:
      - key: regions
        title: 区域列表
        tip: 每项含页码/bbox坐标/内容
  PDFExt.encrypt_pdf:
    title: 加密PDF文件
    comment: 为路径为 @{file_path} 的PDF设置打开密码 @{password}，保存至 @{save_path}，输出新文件路径 @{pdf_path_out}
    icon: atom-default
    helpManual: 保存路径留空时在源文件同目录生成 原名_encrypted 文件；密码不能为空
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: password
        title: 打开密码
        tip: ''
      - key: save_path
        title: 保存路径
        tip: 留空时源文件同目录自动命名
    outputList:
      - key: pdf_path_out
        title: 新文件路径
        tip: ''
  PDFExt.rotate_pdf:
    title: 旋转PDF页面
    comment: 将路径为 @{file_path} 的PDF @{direction} 旋转90度，保存至 @{save_path}，输出新文件路径 @{pdf_path_out}
    icon: atom-default
    helpManual: 页码范围留空为全部页面，格式为1,3,5-7；保存路径留空时源文件同目录生成 原名_rotated 文件
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: direction
        title: 旋转方向
        tip: ''
      - key: page_range
        title: 页码范围
        tip: 留空为全部页面，格式为1,3,5-7
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
      - key: save_path
        title: 保存路径
        tip: 留空时源文件同目录自动命名
    outputList:
      - key: pdf_path_out
        title: 新文件路径
        tip: ''
  PDFExt.get_page_size:
    title: 获取PDF页面尺寸
    comment: 获取路径为 @{file_path} 第 @{page_number} 页的宽 @{width} 高 @{height}（pt磅）
    icon: atom-default
    helpManual: A4竖版约为宽595.28 x 高841.89磅；配合"提取PDF区域文本"原子使用
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: page_number
        title: 页码
        tip: 默认第1页
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
    outputList:
      - key: width
        title: 页面宽(pt)
        tip: ''
      - key: height
        title: 页面高(pt)
        tip: ''
  PDFExt.split_pdf:
    title: 分割PDF文件
    comment: 将路径为 @{file_path} 的PDF按 @{split_mode} 分割，保存至 @{save_dir} 文件夹，输出文件路径列表 @{pdf_paths_out}
    icon: atom-default
    helpManual: '每页一个文件：每一页拆为独立PDF；在指定位置分割：从第N页处分成前后两个文件'
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: split_mode
        title: 分割模式
        tip: ''
      - key: position
        title: 分割位置(页码)
        tip: 在指定位置分割时有效，从该页前分割
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
      - key: save_dir
        title: 保存文件夹
        tip: 留空时源文件同目录
    outputList:
      - key: pdf_paths_out
        title: 文件路径列表
        tip: 分割后的PDF文件路径
  PDFExt.delete_pdf_pages:
    title: 删除PDF页面
    comment: 删除路径为 @{file_path} 的PDF中页码为 @{page_range} 的页面，保存至 @{save_path}，输出新文件路径 @{pdf_path_out}
    icon: atom-default
    helpManual: 页码范围格式为1,3,5-7，负数表示倒数（-1为最后一页）；不能删除全部页面；保存路径留空时源文件同目录生成 原名_deleted 文件
    inputList:
      - key: file_path
        title: PDF文件路径
        tip: ''
      - key: page_range
        title: 删除页码范围
        tip: 格式为1,3,5-7
      - key: password
        title: PDF文件密码
        tip: 无密码则留空
      - key: save_path
        title: 保存路径
        tip: 留空时源文件同目录自动命名
    outputList:
      - key: pdf_path_out
        title: 新文件路径
        tip: ''
  PDFExt.images_to_pdf:
    title: 图片合并为PDF
    comment: 将图片列表 @{image_files} 合并为一个PDF文件（每页一图），保存至 @{save_path}，输出PDF文件路径 @{pdf_path_out}
    icon: atom-default
    helpManual: 支持JPEG/PNG/BMP等常见格式；按EXIF方向信息自动纠正拍照方向；保存路径留空时存到第一张图片所在目录
    inputList:
      - key: image_files
        title: 图片路径列表
        tip: 多个图片路径，逗号分隔或列表
      - key: save_path
        title: 保存路径
        tip: 留空时存到第一张图片所在目录
    outputList:
      - key: pdf_path_out
        title: PDF文件路径
        tip: ''
  PDFExt.create_watermark_pdf:
    title: 生成水印PDF文件
    comment: 生成文字为 @{text} 的水印PDF（布局 @{layout} 字号 @{font_size} 透明度 @{opacity}% 旋转 @{rotation} 度），保存至 @{save_path}，输出 @{watermark_path}
    icon: atom-default
    helpManual: '生成A4单页水印文件，配合"添加PDF水印"原子叠加到目标文档；透明度1-100，旋转0-359，颜色支持#RRGGBB格式'
    inputList:
      - key: text
        title: 水印文字
        tip: ''
      - key: save_path
        title: 保存路径
        tip: 留空时保存到工作目录 astron/ 下
      - key: layout
        title: 水印布局
        tip: ''
      - key: font_size
        title: 字号
        tip: 默认36
      - key: opacity
        title: 透明度(%)
        tip: 1-100，默认20
      - key: rotation
        title: 旋转角度
        tip: 0-359，默认45
      - key: color
        title: 颜色
        tip: '#RRGGBB格式，默认#808080灰色'
    outputList:
      - key: watermark_path
        title: 水印文件路径
        tip: ''
  PDFExt.add_pdf_watermark:
    title: 添加PDF水印
    comment: 将水印文件 @{watermark_path} 叠加到路径为 @{file_path} 的PDF每一页，保存至 @{save_path}，输出新文件路径 @{pdf_path_out}
    icon: atom-default
