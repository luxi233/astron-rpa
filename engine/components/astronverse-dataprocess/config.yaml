atomic:
  DataProcess.set_variable_value:
    title: 设置变量值
    comment: 赋值 @{value} 给变量 @{variable_var}
    icon: set-variable-value
    helpManual: ''
    inputList:
      - key: value
        title: 变量值
        tip: 输入需要设置的变量值
      - key: variable_type
        title: 变量类型
        tip: 选择需要设置的变量类型
    outputList:
      - key: variable_var
        title: 设置后的变量值
        tip: ''
  DataConvertProcess.json_convertor:
    title: JSON字符串互转
    comment: >-
      将输入文本 @{input_data} 从JSON格式转换为字符串或从字符串格式转换为JSON格式，返回转换后的文本
      @{json_convert_data}
    icon: json-string-convert
    helpManual: ''
    inputList:
      - key: input_data
        title: 输入内容
        tip: ''
      - key: convert_type
        title: 转换类型
        tip: ''
    outputList:
      - key: json_convert_data
        title: 转换结果
        tip: ''
  DataConvertProcess.other_to_str:
    title: 其他格式转文本
    comment: 将输入内容 @{input_data} 转换为文本（字符串）格式，返回转换后的结果 @{other_convert_str}
    icon: format-to-text
    helpManual: ''
    inputList:
      - key: input_data
        title: 输入内容
        tip: ''
    outputList:
      - key: other_convert_str
        title: 转换结果
        tip: ''
  DataConvertProcess.str_to_other:
    title: 文本转其他格式
    comment: 将输入文本（字符串） @{input_data} 转换为其他格式，返回转换后的结果 @{str_convert_other}
    icon: text-convert-format
    helpManual: ''
    inputList:
      - key: input_data
        title: 输入内容
        tip: ''
      - key: convert_type
        title: 转换类型
        tip: ''
    outputList:
      - key: str_convert_other
        title: 转换结果
        tip: ''
  DictProcess.create_new_dict:
    title: 创建新字典
    comment: 创建一个字典，返回创建的字典 @{created_new_dict_data}
    icon: create-new-dict
    helpManual: ''
    inputList:
      - key: dict_data
        title: 字典数据
        tip: ''
    outputList:
      - key: created_new_dict_data
        title: 新创建的字典
        tip: ''
  DictProcess.set_value_to_dict:
    title: 字典设置值
    comment: >-
      设置字典 @{dict_data} 的键为 @{dict_key} ，值为 @{value} ，返回设置后的字典
      @{inserted_dict_data}
    icon: dict-set-value
    helpManual: ''
    inputList:
      - key: dict_data
        title: 字典数据
        tip: ''
      - key: dict_key
        title: 键（key）
        tip: ''
      - key: value
        title: 值（value）
        tip: ''
    outputList:
      - key: inserted_dict_data
        title: 设置后的字典
        tip: ''
  DictProcess.delete_value_from_dict:
    title: 字典删除值
    comment: 从字典 @{dict_data} 中删除键为 @{dict_key} 的值，返回删除后的字典 @{deleted_dict_data}
    icon: dict-delete-value
    helpManual: ''
    inputList:
      - key: dict_data
        title: 字典数据
        tip: ''
      - key: dict_key
        title: 键（key）
        tip: ''
    outputList:
      - key: deleted_dict_data
        title: 删除后的字典
        tip: ''
  DictProcess.get_value_from_dict:
    title: 字典获取值
    comment: 获取字典 @{dict_data} 的键为 @{dict_key} 的值 @{get_dict_value}
    icon: dict-get-value
    helpManual: ''
    inputList:
      - key: dict_data
        title: 字典数据
        tip: ''
      - key: dict_key
        title: 键（key）
        tip: ''
      - key: fail_option
        title: 键不存在时处理方式
        tip: 键不存在时是否抛出异常或返回默认值
      - key: default_value
        title: 默认值
        tip: ''
    outputList:
      - key: get_dict_value
        title: 字典值
        tip: ''
  DictProcess.get_keys_from_dict:
    title: 获取字典所有键
    comment: 获取字典 @{dict_data} 的所有键 @{get_dict_keys}
    icon: get-dict-all-keys
    helpManual: ''
    inputList:
      - key: dict_data
        title: 字典数据
        tip: ''
    outputList:
      - key: get_dict_keys
        title: 键列表
        tip: ''
  DictProcess.get_values_from_dict:
    title: 获取字典所有值
    comment: 获取字典 @{dict_data} 的所有值 @{get_dict_values}
    icon: get-dict-all-values
    helpManual: ''
    inputList:
      - key: dict_data
        title: 字典数据
        tip: ''
    outputList:
      - key: get_dict_values
        title: 值列表
        tip: ''
  ListProcess.create_new_list:
    title: 创建新列表
    comment: 创建一个 @{list_type} 类型的列表，返回创建的列表 @{created_list_data}
    icon: create-new-list
    helpManual: ''
    inputList:
      - key: list_type
        title: 列表类型
        tip: ''
      - key: size
        title: 列表长度
        tip: ''
      - key: value
        title: 列表初始值
        tip: ''
      - key: custom_list
        title: 自定义列表
    outputList:
      - key: created_list_data
        title: 创建的列表
        tip: ''
  ListProcess.clear_list:
    title: 清空列表
    comment: 清空列表 @{list_data} ，返回清空后的列表 @{cleared_list_data}
    icon: list-clear
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
    outputList:
      - key: cleared_list_data
        title: 清空后的列表
        tip: ''
  ListProcess.insert_value_to_list:
    title: 列表插入值
    comment: >-
      将值 @{value} 插入到列表 @{list_data} 的 @{insert_method} 位置 @{index} ，返回插入后的列表
      @{inserted_list_data}
    icon: list-insert-value
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
      - key: value
        title: 插入值
        tip: ''
      - key: insert_method
        title: 插入方式
        tip: ''
      - key: index
        title: 插入位置
        tip: ''
    outputList:
      - key: inserted_list_data
        title: 插入后的列表
        tip: ''
  ListProcess.change_value_in_list:
    title: 列表修改值
    comment: >-
      将列表 @{list_data} 的 @{index} 位置的值修改为 @{new_value} ，返回修改后的列表
      @{changed_list_data}
    icon: list-modify-value
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
      - key: index
        title: 位置索引
        tip: 填写需要修改值的位置索引，从0开始，修改第一个值索引为0，修改第二个值索引为1，以此类推
      - key: new_value
        title: 新值
        tip: ''
    outputList:
      - key: changed_list_data
        title: 修改后的列表
        tip: ''
  ListProcess.get_list_position:
    title: 获取值在列表位置
    comment: 获取值 @{value} 在列表 @{list_data} 的位置 @{get_list_position}
    icon: get-value-position
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
      - key: value
        title: 值
        tip: ''
    outputList:
      - key: get_list_position
        title: 位置索引
        tip: ''
  ListProcess.remove_value_from_list:
    title: 列表删除值
    comment: >-
      以 @{del_mode} 删除@{list_data}@{del_value||del_pos}的内容，返回删除后的列表
      @{removed_list_data}
    icon: list-remove-value
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
      - key: del_mode
        title: 删除方式
        tip: ''
      - key: del_value
        title: 删除值
        tip: ''
      - key: del_pos
        title: 删除位置
        tip: 可指定单个或多个位置数据，多个位置索引之间用逗号隔开，如：1,3,5
    outputList:
      - key: removed_list_data
        title: 删除后的列表
        tip: ''
  ListProcess.sort_list:
    title: 列表排序
    comment: 对列表 @{list_data} 进行 @{sort_method} 排序，返回排序后的列表 @{sorted_list_data}
    icon: list-sort
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
      - key: sort_method
        title: 排序方式
        tip: ''
    outputList:
      - key: sorted_list_data
        title: 排序后的列表
        tip: ''
  ListProcess.random_shuffle_list:
    title: 列表随机打乱顺序
    comment: 对列表 @{list_data} 进行随机打乱顺序，返回打乱顺序后的列表 @{shuffled_list_data}
    icon: list-shuffle
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
    outputList:
      - key: shuffled_list_data
        title: 打乱顺序后的列表
        tip: ''
  ListProcess.filter_elements_from_list:
    title: 剔除列表中的多项
    comment: 从列表 @{list_data_1} 中剔除列表 @{list_data_2} 中的元素，返回剔除后的列表 @{filter_list_data}
    icon: list-remove-multiple
    helpManual: ''
    inputList:
      - key: list_data_1
        title: 待处理列表
        tip: 填写需要处理的列表
      - key: list_data_2
        title: 剔除元素列表
        tip: 填写需要剔除的元素列表，如果待处理列表中有剔除元素列表中的元素，则剔除
    outputList:
      - key: filter_list_data
        title: 剔除后的列表
        tip: 返回剔除后的列表
  ListProcess.reverse_list:
    title: 列表反转
    comment: 将列表 @{list_data} 反转，返回反转后的列表 @{reversed_list_data}
    icon: list-reverse
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
    outputList:
      - key: reversed_list_data
        title: 反转后的列表
        tip: ''
  ListProcess.merge_list:
    title: 列表合并
    comment: 将列表 @{list_data_1} 和列表 @{list_data_2} 合并为一个列表 @{merged_list_data}
    icon: list-merge
    helpManual: ''
    inputList:
      - key: list_data_1
        title: 第一个列表
        tip: ''
      - key: list_data_2
        title: 第二个列表
        tip: ''
    outputList:
      - key: merged_list_data
        title: 合并后的列表
        tip: ''
  ListProcess.get_unique_list:
    title: 列表去重
    comment: 将列表 @{list_data} 去重，返回去重后的列表 @{unique_list_data}
    icon: list-remove-duplicates
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
    outputList:
      - key: unique_list_data
        title: 去重后的列表
        tip: ''
  ListProcess.get_common_elements_from_list:
    title: 获取两个列表的重复项
    comment: 获取列表 @{list_data_1} 和列表 @{list_data_2} 的重复项，返回重复项列表 @{common_list_data}
    icon: get-list-duplicates
    helpManual: ''
    inputList:
      - key: list_data_1
        title: 第一个列表
        tip: ''
      - key: list_data_2
        title: 第二个列表
        tip: ''
    outputList:
      - key: common_list_data
        title: 重复项列表
        tip: ''
  ListProcess.get_value_from_list:
    title: 根据索引获取列表值
    comment: 根据索引 @{index} 获取列表 @{list_data} 的值 @{get_list_value}
    icon: get-list-value-by-index
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
      - key: index
        title: 索引
        tip: ''
    outputList:
      - key: get_list_value
        title: 值
        tip: ''
  ListProcess.get_length_of_list:
    title: 获取列表长度
    comment: 获取列表 @{list_data} 的长度 @{get_list_length}
    icon: get-list-length
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
    outputList:
      - key: get_list_length
        title: 长度
        tip: ''
  ListProcess.filter_empty_items:
    title: 过滤空值项
    comment: >-
      删除列表 @{list_data} 中的空值项（一维列表删除空值项，二维列表删除全空行），返回过滤后的列表
      @{filtered_list_data}
    icon: list-remove-multiple
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: 一维列表移除 None、空串、纯空白串；二维列表移除整行均为空值的行
      - key: only_trim_trailing
        title: 仅去除末尾空值
        tip: 勾选后仅移除末尾连续的空值项（或空行），适合处理表格尾部空行
        formType:
          type: CHECKBOX
    outputList:
      - key: filtered_list_data
        title: 过滤后的列表
        tip: ''
  ListProcess.strip_text_items:
    title: 删除文本项两端空格
    comment: 去除列表 @{list_data} 中所有字符串项的两端空格，返回处理后的列表 @{stripped_list_data}
    icon: text-trim-spaces
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: 支持多维列表，仅处理字符串项
    outputList:
      - key: stripped_list_data
        title: 处理后的列表
        tip: ''
  ListProcess.get_list_sum:
    title: 列表求和
    comment: 对列表 @{list_data} 中的所有数值求和，结果为 @{sum_value}
    icon: math-calculation
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: 数字字符串（如 "12"）自动参与计算，非数值项跳过
    outputList:
      - key: sum_value
        title: 求和结果
        tip: ''
  ListProcess.get_list_average:
    title: 获取列表平均值
    comment: 获取列表 @{list_data} 中所有数值的平均值，结果为 @{average_value}
    icon: math-calculation
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: 数字字符串（如 "12"）自动参与计算，非数值项跳过
    outputList:
      - key: average_value
        title: 平均值
        tip: ''
  ListProcess.get_list_extremum:
    title: 获取列表最值
    comment: 获取列表 @{list_data} 中所有数值的 @{extremum_type}，结果为 @{extremum_value}
    icon: get-absolute-value
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: 数字字符串（如 "12"）自动参与计算，非数值项跳过
      - key: extremum_type
        title: 获取
        tip: ''
    outputList:
      - key: extremum_value
        title: 最大值/最小值
        tip: ''
  ListProcess.flatten_list:
    title: 多维列表转一维列表
    comment: 将多维列表 @{list_data} 转成一维列表，如 [[1,2],[3,4]] 转成 [1,2,3,4]，结果为 @{flattened_list_data}
    icon: text-split-to-list
    helpManual: ''
    inputList:
      - key: list_data
        title: 多维列表
        tip: 需要展开的多层嵌套列表
    outputList:
      - key: flattened_list_data
        title: 一维列表
        tip: ''
  ListProcess.reshape_list_to_2d:
    title: 一维列表转二维列表
    comment: >-
      将一维列表 @{list_data} 按每行 @{column_count} 列转换为二维列表，如 [1,2,3,4,5,6] 按每行2列转成
      [[1,2],[3,4],[5,6]]，结果为 @{reshaped_list_data}
    icon: create-new-list
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
      - key: column_count
        title: 列数
        tip: 每行包含的列数，最后一行不足时用 None 补齐
    outputList:
      - key: reshaped_list_data
        title: 二维列表
        tip: ''
  ListProcess.transpose_list:
    title: 列表转置
    comment: 将二维列表 @{list_data} 行列互换，如 [[1,2],[3,4]] 转成 [[1,3],[2,4]]，结果为 @{transposed_list_data}
    icon: list-reverse
    helpManual: ''
    inputList:
      - key: list_data
        title: 二维列表
        tip: 行长度不齐时用 None 补齐
    outputList:
      - key: transposed_list_data
        title: 转置后的列表
        tip: ''
  ListProcess.zip_two_lists:
    title: 列表组装
    comment: >-
      将列表 @{list_data_1} 和 @{list_data_2} 一项一项对应组装为二维列表或字典，结果为
      @{assembled_object}
    icon: list-merge
    helpManual: ''
    inputList:
      - key: list_data_1
        title: 列表1
        tip: 组装为字典时作为键
      - key: list_data_2
        title: 列表2
        tip: 组装为字典时作为值
      - key: as_dict
        title: 组装为字典
        tip: 勾选后组装为字典，否则组装为二维列表
        formType:
          type: CHECKBOX
      - key: fill_value
        title: 长度不齐时填充的内容
        tip: 两个列表长度不一致时，短的部分用该内容补齐，默认为空
    outputList:
      - key: assembled_object
        title: 组装结果
        tip: 二维列表或字典
  ListProcess.list_to_dict_keys:
    title: 列表项转字典键
    comment: 将列表 @{list_data} 每一项作为字典的键（值为 None），结果为 @{dict_data}
    icon: create-new-dict
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
    outputList:
      - key: dict_data
        title: 新字典
        tip: ''
  ListProcess.replace_text_in_list:
    title: 多维列表文本替换
    comment: >-
      将列表 @{list_data} 中的 @{find_text} 替换为 @{replace_text}（支持正则），返回替换后的列表
      @{replaced_list_data}
    icon: text-replace-content
    helpManual: ''
    inputList:
      - key: list_data
        title: 待替换列表
        tip: 支持多维列表，仅处理字符串项
      - key: find_text
        title: 查找内容
        tip: 被替换的文本或正则表达式
      - key: replace_text
        title: 替换为
        tip: 替换后的文本
      - key: use_regex
        title: 使用正则表达式
        tip: 勾选后查找内容按正则表达式处理
        formType:
          type: CHECKBOX
    outputList:
      - key: replaced_list_data
        title: 替换后的列表
        tip: ''
  ListProcess.convert_item_type:
    title: 列表项类型转换
    comment: 将列表 @{list_data} 中的项做 @{convert_direction} 转换，返回转换后的列表 @{converted_list_data}
    icon: text-convert-format
    helpManual: ''
    inputList:
      - key: list_data
        title: 待转换列表
        tip: 支持多维列表
      - key: convert_direction
        title: 转换方向
        tip: ''
      - key: ignore_error
        title: 忽略不能转换的项
        tip: 勾选后跳过无法转换的项，否则遇到无法转换的项将报错
        formType:
          type: CHECKBOX
    outputList:
      - key: converted_list_data
        title: 转换后的列表
        tip: ''
  ListProcess.slice_list:
    title: 截取列表项
    comment: >-
      在列表 @{list_data} 中截取从 @{start_index} 到 @{end_index} 的项（含起始、不含结束），结果为
      @{sliced_list_data}
    icon: get-list-value-by-index
    helpManual: ''
    inputList:
      - key: list_data
        title: 原列表
        tip: ''
      - key: start_index
        title: 起始位置
        tip: 包含该位置的项，支持负数（-1 表示倒数第一项）
      - key: end_index
        title: 结束位置
        tip: 不包含该位置的项，支持负数（-1 表示倒数第一项）
    outputList:
      - key: sliced_list_data
        title: 截取后的列表
        tip: ''
  ListProcess.copy_list:
    title: 复制列表
    comment: 深拷贝列表 @{list_data} ，返回副本 @{copied_list_data}（修改副本不影响原列表）
    icon: create-new-list
    helpManual: ''
    inputList:
      - key: list_data
        title: 列表数据
        tip: ''
    outputList:
      - key: copied_list_data
        title: 副本列表
        tip: ''
  ListProcess.check_item_contains:
    title: 列表项判断包含
    comment: >-
      判断列表 @{list_data} 中是否有任意一项 @{contain_mode} 字符串 @{text}，判断结果为
