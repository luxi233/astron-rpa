name: Release Full Pipeline (QA → Build Client → Publish)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例: v1.1.8-2; 必须先推送到远程 origin)'
        required: true
      title:
        description: 'Release标题 (留空自动生成)'
        required: false
        default: ''
      prerelease:
        description: '预发布标记 (auto根据tag自动判断)'
        required: false
        type: choice
        default: 'auto'
        options:
          - 'auto'
          - 'true'
          - 'false'
      notes:
        description: 'Release说明 (留空自动生成)'
        required: false
        default: ''
      skip_qa:
        description: '跳过QA Gate (紧急发布用)'
        required: false
        default: false
        type: boolean
      skip_engine:
        description: '构建时跳过引擎(Python)构建 (和 Build Windows Client 的 skip_engine 一致)'
        required: false
        default: false
        type: boolean
      skip_frontend:
        description: '构建时跳过前端构建 (调试用)'
        required: false
        default: false
        type: boolean
      skip_version_check:
        description: '发布时跳过版本一致性校验 (非常紧急时使用)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-pipeline-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  UV_LOCK_TIMEOUT: 600

jobs:
  # ============================================================================
  # Stage 1 — QA Gate (ruff format, py_compile, tsc typecheck)
  # ============================================================================
  qa-gate:
    name: 🧪 QA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.skip_qa != true }}
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # ---- 1.1 ruff format check (engine) ----
      - name: ruff format check (engine)
        working-directory: engine
        run: |
          set -e
          cd ..  # run from repo root so path=./engine resolves correctly
          uv run --project engine --dev ruff format ./engine --check

      # ---- 1.2 py_compile all engine sources (Python 3.13) ----
      - name: py_compile all engine sources
        run: |
          set -e
          cd engine
          uv run python - <<'PY'
          import os, py_compile, sys
          errors = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.venv', '__pycache__') and not d.endswith('.venv')]
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          py_compile.compile(path, doraise=True)
                      except py_compile.PyCompileError as e:
                          errors.append(str(e))
          if errors:
              print(f'❌ {len(errors)} compile error(s):')
              for e in errors[:30]:
                  print(' ', e)
              sys.exit(1)
          print(f'✅ All .py files compile OK (Python {sys.version.split()[0]})')
          PY

      # ---- 1.3 browser-plugin TypeScript typecheck ----
      - name: browser-plugin tsc --noEmit
        working-directory: frontend
        run: |
          set -e
          if [ ! -d node_modules ]; then
            echo "Installing frontend dependencies (frozen lockfile)..."
            pnpm install --frozen-lockfile --prefer-offline
          fi
          cd packages/browser-plugin
          pnpm exec tsc --noEmit

      - name: ✅ QA Gate Summary
        if: success()
        run: |
          echo "🎉 QA Gate PASSED"
          echo "   • ruff format:      clean"
          echo "   • Python 3.13:     compiled"
          echo "   • browser-plugin:   tsc zero errors"

  # ============================================================================
  # Stage 2 — Build Windows Client (runs on windows; depends on QA Gate)
  # ============================================================================
  build-client:
    name: 🪟 Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 90
    needs: qa-gate
    # If skip_qa=true, qa-gate is skipped; still allow build to run.
    if: |
      always() &&
      (needs.qa-gate.result == 'success' || needs.qa-gate.result == 'skipped')

    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python 3.13 (x64)
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Resolve python.exe path (Windows)
        shell: pwsh
        run: |
          $pyLocation = "${{ steps.setup-python.outputs.pythonLocation }}"
          if ($pyLocation) {
            $pyExe = Join-Path $pyLocation "python.exe"
          } else {
            $pyCmd = Get-Command python -ErrorAction SilentlyContinue
            if ($pyCmd) { $pyExe = $pyCmd.Source }
            else { $pyExe = (py -3.13 -c "import sys; print(sys.executable)" 2>$null) }
          }
          if (-not (Test-Path $pyExe)) { Write-Host "Python not found at $pyExe"; exit 1 }
          Write-Host "Python EXE: $pyExe"
          echo "PYTHON_EXE=$pyExe" >> $env:GITHUB_ENV

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install SWIG
        shell: pwsh
        run: choco install swig -y --no-progress

      - name: Install 7-Zip
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            choco install 7zip -y --no-progress
          }

      - name: UV cache warmup
        shell: pwsh
        run: |
          uv pip install --python "$env:PYTHON_EXE" hatchling pluggy tomlkit pathspec packaging

      - name: Build engine
        if: ${{ inputs.skip_engine != true }}
        shell: pwsh
        run: |
          & cmd /c "build.bat --python-exe `"$env:PYTHON_EXE`" --skip-frontend 2>&1" | Tee-Object -FilePath build_engine.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content build_engine.log -Tail 50
            exit $exitCode
          }

      - name: Build frontend + Electron EXE
        if: ${{ inputs.skip_frontend != true }}
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\frontend"
          & cmd /c "pnpm install --prefer-offline 2>&1"
          & cmd /c "pnpm --filter astron-rpa run build:sdk 2>&1"
          & cmd /c "cd packages\electron-app && npx electron-vite build 2>&1" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\build_frontend.log"
          $evExit = $LASTEXITCODE
          if ($evExit -ne 0) { exit $evExit }
          & cmd /c "cd packages\electron-app && npm run build:web 2>&1"
          & cmd /c "cd packages\electron-app && npx electron-builder --win 2>&1" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\build_electron.log"
          $ebExit = $LASTEXITCODE
          if ($ebExit -ne 0) {
            Get-Content "$env:GITHUB_WORKSPACE\build_electron.log" -Tail 30
            exit $ebExit
          }
          Set-Location "$env:GITHUB_WORKSPACE"

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: |
            build_engine.log
            build_frontend.log
            build_electron.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload EXE installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstronRPA-windows-exe
          path: frontend/packages/electron-app/dist/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload python_core.7z
        uses: actions/upload-artifact@v4
        with:
          name: python-core-7z
          path: resources/python_core.7z
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem "frontend\packages\electron-app\dist\*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            Write-Host "✅ EXE artifacts produced:"
            $exeFiles | ForEach-Object { Write-Host "  $($_.Name) - $([math]::Round($_.Length/1MB, 2)) MB" }
          } else { Write-Host "⚠️ No EXE found in dist directory (build may have failed)" }

  # ============================================================================
  # Stage 3 — Publish GitHub Release (assets + snapshot + notes)
  # ============================================================================
  publish-release:
    name: 🚀 Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-client
    if: needs.build-client.result == 'success'
    steps:
      - name: Resolve parameters (auto prerelease, default title)
        id: params
        run: |
          TAG="${{ inputs.tag }}"
          PRE_IN="${{ inputs.prerelease }}"
          if [[ "$PRE_IN" == "auto" ]]; then
            PRE_OUT=$([[ "$TAG" == *"-"* ]] && echo "true" || echo "false")
          else
            PRE_OUT="$PRE_IN"
          fi
          TITLE="${{ inputs.title }}"
          [[ -z "$TITLE" ]] && TITLE="Astron RPA ${TAG}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE_OUT" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "resolved: tag=$TAG pre=$PRE_OUT title=$TITLE"

      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.params.outputs.tag }}

      # ---- 3.1 Version consistency gate ----
      - name: Version consistency (package.json ↔ tag)
        if: ${{ inputs.skip_version_check != true }}
        run: |
          set -e
          TAG="${{ steps.params.outputs.tag }}"
          TAG_VER="${TAG#v}"
          PKG_VER=$(node -p "require('./frontend/packages/electron-app/package.json').version")
          echo "tag: $TAG_VER | package: $PKG_VER"
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "❌ Version mismatch: tag=$TAG_VER package.json=$PKG_VER"
            echo "   Use skip_version_check=true to bypass, or correct tag / package.json first"
            exit 1
          fi
          echo "✅ Version match"

      # ---- 3.2 Download artifact from upstream job ----
      - name: Download EXE artifact (from build-client job)
        uses: actions/download-artifact@v4
        with:
          name: AstronRPA-windows-exe
          path: dist

      - name: List dist/ after download
        run: ls -lhR dist

      # ---- 3.3 WPS AirScript + snapshot ----
      - name: Prepare WPS AirScript + server snapshot + SERVER-DEPLOY.txt
        env:
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          set -e
          mkdir -p dist
          cp engine/components/astronverse-kdocs/scripts/wps_read_sheet.js dist/
          WPS_LINES=$(wc -l < dist/wps_read_sheet.js)
          echo "✅ WPS AirScript: $WPS_LINES lines"

          COMMIT=$(git rev-parse HEAD)
          STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git archive --format=tar.gz -o "dist/server-snapshot-${TAG}.tar.gz" HEAD -- ':!resources'
          cat > dist/SERVER-DEPLOY.txt <<EOF
          AstronRPA Server Deployment Snapshot
          ====================================
          Tag:    ${TAG}
          Commit: ${COMMIT}
          Built:  ${STAMP}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Contents: full repository source snapshot (git archive, no .git).
          Excludes resources/ (Windows client packaging only). .env is NOT
          included (secrets live outside git).

          Fresh deploy:
            1. Extract to deploy directory
            2. Create docker/.env (from example) and fill in secrets
            3. cd docker && docker compose up -d

          Upgrade deploy:
            1. Extract over deploy directory (.env / data / logs / docker/volumes/backup stay untouched)
            2. cd docker && bash scripts/hot-update-atom-meta.sh
            3. docker compose restart (if backend code changed)

          Rollback to this version:
            1. Download this server-snapshot-${TAG}.tar.gz
            2. Extract over deploy directory (or clean extract keeping .env / data / logs / docker/volumes/backup)
            3. cd docker && bash scripts/hot-update-atom-meta.sh
            4. If metadata still broken, restore from auto backup:
               gunzip -c docker/volumes/backup/<latest>.sql.gz | docker exec -i rpa-opensource-mysql mysql -u<user> -p<pass> rpa
          EOF

      # ---- 3.4 Asset existence gate ----
      - name: Asset gate — all 4 present
        run: |
          set -e
          TAG="${{ steps.params.outputs.tag }}"
          EXE_COUNT=$(find dist -maxdepth 1 -name "*.exe" | wc -l | tr -d ' ')
          echo "Assets:"
          find dist -maxdepth 1 -type f -exec ls -lh {} \;
          FAIL=0
          [[ "$EXE_COUNT" -ge 1 ]] || { echo "❌ Missing *.exe from build job"; FAIL=1; }
          [[ -f dist/wps_read_sheet.js ]] || { echo "❌ Missing wps_read_sheet.js"; FAIL=1; }
          [[ -f "dist/server-snapshot-${TAG}.tar.gz" ]] || { echo "❌ Missing server snapshot"; FAIL=1; }
          [[ -f dist/SERVER-DEPLOY.txt ]] || { echo "❌ Missing SERVER-DEPLOY.txt"; FAIL=1; }
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "✅ All 4 assets present"

      # ---- 3.5 Auto-generate release notes ----
      - name: Compose release notes
        run: |
          TAG="${{ steps.params.outputs.tag }}"
          USER_NOTES="${{ inputs.notes }}"
          if [[ -n "$USER_NOTES" ]]; then
            NOTES="$USER_NOTES"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            LOG=$([[ -n "$PREV_TAG" ]] && git log --oneline "${PREV_TAG}..HEAD" || git log --oneline -20)
            NOTES=$(cat <<EOF
          ## Release ${TAG}

          **Published by Release Full Pipeline (QA → Build → Publish)**

          ### What's Changed${PREV_TAG:+ (${PREV_TAG} → ${TAG})}
          $(echo "$LOG" | sed 's/^/- /')

          ### Included Assets
          - 🪟 **Windows installer (.exe)** — AstronRPA desktop client
          - 📄 **wps_read_sheet.js** — WPS KDocs AirScript
          - 📦 **server-snapshot-${TAG}.tar.gz** — Server source snapshot
          - 📋 **SERVER-DEPLOY.txt** — Deploy / upgrade / rollback guide

          ### Pipeline Stages Status
          - 🧪 QA Gate: ${{ needs.qa-gate.result == 'success' && '✅ PASSED' || (needs.qa-gate.result == 'skipped' && '⏭️ SKIPPED (skip_qa=true)' || '❌ UNKNOWN') }}
          - 🪟 Build Client: ✅ PASSED
          - 🚀 Publish: in progress

          *Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}*
          EOF
          )
          fi
          {
            echo 'NOTES_BODY<<GH_EOF_MARKER'
            echo "$NOTES"
            echo 'GH_EOF_MARKER'
          } >> $GITHUB_ENV

      # ---- 3.6 Create GitHub Release ----
      - name: gh release create (attach all 4 assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.params.outputs.tag }}
          TITLE: ${{ steps.params.outputs.title }}
          PRE: ${{ steps.params.outputs.prerelease }}
        run: |
          set -e
          FLAGS=""
          [[ "$PRE" == "true" ]] && FLAGS="--prerelease"
          gh release create "$TAG" --title "$TITLE" --notes "$NOTES_BODY" $FLAGS \
            dist/*.exe dist/wps_read_sheet.js \
            "dist/server-snapshot-${TAG}.tar.gz" dist/SERVER-DEPLOY.txt

      # ---- 3.7 Success summary ----
      - name: 🎉 Release Pipeline Complete
        if: success()
        run: |
          TAG="${{ steps.params.outputs.tag }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
          echo ""
          echo "=================================================================="
          echo "  🚀 Release Full Pipeline completed!"
          echo "=================================================================="
          echo "  Release URL:   $RELEASE_URL"
          echo "  Tag:           $TAG (pre=${{ steps.params.outputs.prerelease }})"
          echo "  Triggered by:  ${{ github.actor }}"
          echo "  Workflow run:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "  Stages:"
          echo "    🧪 QA Gate:        ${{ needs.qa-gate.result }}"
          echo "    🪟 Build Client:   ${{ needs.build-client.result }}"
          echo "    🚀 Publish:        success"
          echo ""
          echo "  🔄 Auto follow-ups:"
          echo "    - build-push-backend.yml triggers on release:published → builds 5 Docker images"
          echo "=================================================================="
