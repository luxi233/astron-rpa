name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run ID containing the artifact'
        required: true
      tag:
        description: 'Release tag (e.g. v1.1.8)'
        required: true
      title:
        description: 'Release title'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      notes:
        description: 'Release notes (single line)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    name: Attach build artifact to release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo (for bundled WPS AirScript)
        uses: actions/checkout@v4

      - name: Download EXE artifact from source run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: AstronRPA-windows-exe
          path: dist

      - name: List downloaded files
        run: ls -lhR dist

      - name: Copy WPS AirScript to dist
        run: cp engine/components/astronverse-kdocs/scripts/wps_read_sheet.js dist/

      - name: Create release with EXE asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          PRE: ${{ inputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRE" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" --title "$TITLE" --notes "$NOTES" $FLAGS dist/*.exe dist/wps_read_sheet.js
