name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run ID containing the artifact'
        required: true
      tag:
        description: 'Release tag (e.g. v1.1.8)'
        required: true
      title:
        description: 'Release title'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      notes:
        description: 'Release notes (single line)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    name: Attach build artifact to release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo at release tag (for WPS AirScript & server snapshot)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download EXE artifact from source run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: AstronRPA-windows-exe
          path: dist

      - name: List downloaded files
        run: ls -lhR dist

      - name: Copy WPS AirScript to dist
        run: cp engine/components/astronverse-kdocs/scripts/wps_read_sheet.js dist/

      - name: Build server snapshot (full repo minus client-only resources)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git archive --format=tar.gz -o "dist/server-snapshot-${TAG}.tar.gz" HEAD -- ':!resources'
          cat > dist/SERVER-DEPLOY.txt <<EOF
          AstronRPA Server Deployment Snapshot
          ====================================
          Tag:    ${TAG}
          Commit: ${COMMIT}
          Built:  ${STAMP}

          Contents: full repository source snapshot (git archive, no .git).
          Excludes resources/ (Windows client packaging only). .env is NOT
          included (secrets live outside git).

          Fresh deploy:
            1. Extract to deploy directory
            2. Create docker/.env (from example) and fill in secrets
            3. cd docker && docker compose up -d

          Upgrade deploy:
            1. Extract over deploy directory (.env / data / logs / docker/volumes/backup stay untouched)
            2. cd docker && bash scripts/hot-update-atom-meta.sh
            3. docker compose restart (if backend code changed)

          Rollback to this version:
            1. Download this server-snapshot-${TAG}.tar.gz
            2. Extract over deploy directory (or clean extract keeping .env / data / logs / docker/volumes/backup)
            3. cd docker && bash scripts/hot-update-atom-meta.sh
            4. If metadata still broken, restore from auto backup:
               gunzip -c docker/volumes/backup/<latest>.sql.gz | docker exec -i rpa-opensource-mysql mysql -u<user> -p<pass> rpa
          EOF

      - name: Create release with EXE + server snapshot assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          PRE: ${{ inputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRE" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" --title "$TITLE" --notes "$NOTES" $FLAGS \
            dist/*.exe dist/wps_read_sheet.js \
            dist/server-snapshot-${TAG}.tar.gz dist/SERVER-DEPLOY.txt
