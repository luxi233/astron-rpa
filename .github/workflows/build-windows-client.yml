name: Build Windows Client

on:
  workflow_dispatch:
    inputs:
      skip_engine:
        description: '跳过引擎（Python）构建'
        required: false
        default: false
        type: boolean
      skip_frontend:
        description: '跳过前端构建'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  UV_LOCK_TIMEOUT: 600

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Find Python path
        shell: pwsh
        run: |
          $pyLocation = "${{ steps.setup-python.outputs.pythonLocation }}"
          if ($pyLocation) {
            $pyExe = Join-Path $pyLocation "python.exe"
          } else {
            $pyCmd = Get-Command python -ErrorAction SilentlyContinue
            if ($pyCmd) { $pyExe = $pyCmd.Source }
            else { $pyExe = (py -3.13 -c "import sys; print(sys.executable)" 2>$null) }
          }
          if (-not (Test-Path $pyExe)) { Write-Host "Python not found at $pyExe"; exit 1 }
          Write-Host "Python EXE: $pyExe"
          echo "PYTHON_EXE=$pyExe" >> $env:GITHUB_ENV

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install SWIG
        shell: pwsh
        run: choco install swig -y --no-progress

      - name: Install 7-Zip
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            choco install 7zip -y --no-progress
          }

      - name: Run build.bat (full build)
        if: ${{ github.event.inputs.skip_engine != 'true' && github.event.inputs.skip_frontend != 'true' }}
        shell: pwsh
        run: |
          Write-Host "=== Running build.bat (UV_LOCK_TIMEOUT=$env:UV_LOCK_TIMEOUT) ==="
          & cmd /c "build.bat --python-exe `"$env:PYTHON_EXE`" 2>&1" | Tee-Object -FilePath build_output.log
          $exitCode = $LASTEXITCODE
          Write-Host "build.bat exit code: $exitCode"
          if ($exitCode -ne 0) {
            Write-Host "=== Last 50 lines of build log ==="
            Get-Content build_output.log -Tail 50
            exit $exitCode
          }

      - name: Run build.bat (skip engine)
        if: ${{ github.event.inputs.skip_engine == 'true' }}
        shell: cmd
        run: build.bat --python-exe "%PYTHON_EXE%" --skip-engine

      - name: Run build.bat (skip frontend)
        if: ${{ github.event.inputs.skip_frontend == 'true' }}
        shell: cmd
        run: build.bat --python-exe "%PYTHON_EXE%" --skip-frontend

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload EXE installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstronRPA-windows-exe
          path: frontend/packages/electron-app/dist/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload python_core.7z
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-core-7z
          path: resources/python_core.7z
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build Summary ==="
          $exeFiles = Get-ChildItem "frontend\packages\electron-app\dist\*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            Write-Host "EXE artifacts:"
            $exeFiles | ForEach-Object { Write-Host "  $($_.Name) - $([math]::Round($_.Length/1MB, 2)) MB" }
          } else { Write-Host "No EXE found in dist directory" }
