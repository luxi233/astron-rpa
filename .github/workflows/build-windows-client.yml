name: Build Windows Client

on:
  workflow_dispatch:
    inputs:
      skip_engine:
        description: '跳过引擎（Python）构建'
        required: false
        default: false
        type: boolean
      skip_frontend:
        description: '跳过前端构建'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Find Python path
        shell: pwsh
        run: |
          $pyLocation = "${{ steps.setup-python.outputs.pythonLocation }}"
          Write-Host "Python location from setup-python: $pyLocation"
          if ($pyLocation) {
            $pyExe = Join-Path $pyLocation "python.exe"
          } else {
            Write-Host "pythonLocation not available, trying to find python..."
            $pyCmd = Get-Command python -ErrorAction SilentlyContinue
            if ($pyCmd) {
              $pyExe = $pyCmd.Source
            } else {
              $pyExe = (py -3.13 -c "import sys; print(sys.executable)" 2>$null)
              if (-not $pyExe) {
                Write-Host "Cannot find Python executable"
                exit 1
              }
            }
          }
          Write-Host "Python EXE: $pyExe"
          if (Test-Path $pyExe) {
            Write-Host "Python executable verified: OK"
          } else {
            Write-Host "Python executable not found at $pyExe"
            exit 1
          }
          echo "PYTHON_EXE=$pyExe" >> $env:GITHUB_ENV

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install SWIG
        shell: pwsh
        run: choco install swig -y --no-progress

      - name: Install 7-Zip
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            choco install 7zip -y --no-progress
          }
          # Verify 7z.exe exists
          if (Test-Path "C:\Program Files\7-Zip\7z.exe") {
            Write-Host "7-Zip found at C:\Program Files\7-Zip\7z.exe"
          } else {
            Write-Host "7-Zip not found, searching..."
            $sevenZip = Get-ChildItem -Path "C:\Program Files" -Filter "7z.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($sevenZip) {
              Write-Host "Found 7z.exe at: $($sevenZip.FullName)"
              echo "SEVENZ_EXE=$($sevenZip.FullName)" >> $env:GITHUB_ENV
            } else {
              Write-Host "WARNING: 7-Zip not found. build.bat expects C:\Program Files\7-Zip\7z.exe"
            }
          }

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "=== Environment ==="
          Write-Host "Python EXE: $env:PYTHON_EXE"
          Write-Host "Node: $(node --version)"
          Write-Host "pnpm: $(pnpm --version)"
          Write-Host "uv: $(uv --version)"
          try { $sv = swig -version 2>&1 | Select-Object -First 1; Write-Host "swig: $sv" } catch { Write-Host "swig: not found" }
          Write-Host "7z: $(Test-Path 'C:\Program Files\7-Zip\7z.exe')"

      - name: Run build.bat (full build)
        if: ${{ github.event.inputs.skip_engine != 'true' && github.event.inputs.skip_frontend != 'true' }}
        shell: cmd
        run: build.bat --python-exe "%PYTHON_EXE%"

      - name: Run build.bat (skip engine)
        if: ${{ github.event.inputs.skip_engine == 'true' }}
        shell: cmd
        run: build.bat --python-exe "%PYTHON_EXE%" --skip-engine

      - name: Run build.bat (skip frontend)
        if: ${{ github.event.inputs.skip_frontend == 'true' }}
        shell: cmd
        run: build.bat --python-exe "%PYTHON_EXE%" --skip-frontend

      - name: Upload EXE installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstronRPA-windows-exe
          path: frontend/packages/electron-app/dist/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload python_core.7z
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-core-7z
          path: resources/python_core.7z
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build Summary ==="
          $exeFiles = Get-ChildItem "frontend\packages\electron-app\dist\*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            Write-Host "EXE artifacts:"
            $exeFiles | ForEach-Object {
              Write-Host "  $($_.Name) - $([math]::Round($_.Length/1MB, 2)) MB"
            }
          } else {
            Write-Host "No EXE found in dist directory"
          }
          $sevenZFile = Get-Item "resources\python_core.7z" -ErrorAction SilentlyContinue
          if ($sevenZFile) {
            Write-Host "python_core.7z: $([math]::Round($sevenZFile.Length/1MB, 2)) MB"
          } else {
            Write-Host "No python_core.7z found"
          }
