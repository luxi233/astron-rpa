name: Build Windows Client

on:
  workflow_dispatch:
    inputs:
      skip_engine:
        description: '跳过引擎（Python）构建'
        required: false
        default: false
        type: boolean
      skip_frontend:
        description: '跳过前端构建'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Set Python path
        shell: pwsh
        run: |
          $pythonPath = "${{ steps.setup-python.outputs.pythonLocation }}\python.exe"
          Write-Host "Python path: $pythonPath"
          echo "PYTHON_EXE=$pythonPath" >> $env:GITHUB_ENV

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install SWIG
        shell: pwsh
        run: choco install swig -y --no-progress

      - name: Verify 7-Zip
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            choco install 7zip -y --no-progress
          }
          Write-Host "7-Zip: $((Get-Item 'C:\Program Files\7-Zip\7z.exe').FullName)"

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "Python EXE: $env:PYTHON_EXE"
          Write-Host "Node: $(node --version)"
          Write-Host "pnpm: $(pnpm --version)"
          Write-Host "uv: $(uv --version)"
          try { Write-Host "swig: $(swig -version 2>&1 | Select-Object -First 3)" } catch { Write-Host "swig: not found" }
          if (Test-Path $env:PYTHON_EXE) {
            Write-Host "Python executable exists: OK"
          } else {
            Write-Host "Python executable NOT FOUND at $env:PYTHON_EXE"
            exit 1
          }

      - name: Run build.bat (full build)
        if: ${{ github.event.inputs.skip_engine != 'true' && github.event.inputs.skip_frontend != 'true' }}
        shell: cmd
        run: build.bat --python-exe "%PYTHON_EXE%"

      - name: Run build.bat (skip engine)
        if: ${{ github.event.inputs.skip_engine == 'true' }}
        shell: cmd
        run: build.bat --python-exe "%PYTHON_EXE%" --skip-engine

      - name: Run build.bat (skip frontend)
        if: ${{ github.event.inputs.skip_frontend == 'true' }}
        shell: cmd
        run: build.bat --python-exe "%PYTHON_EXE%" --skip-frontend

      - name: Upload EXE installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstronRPA-windows-exe
          path: frontend/packages/electron-app/dist/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload python_core.7z
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-core-7z
          path: resources/python_core.7z
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build Summary ==="
          $exeFiles = Get-ChildItem "frontend\packages\electron-app\dist\*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            Write-Host "EXE artifacts:"
            $exeFiles | ForEach-Object {
              Write-Host "  $($_.Name) - $([math]::Round($_.Length/1MB, 2)) MB"
            }
          } else {
            Write-Host "No EXE found in dist directory"
          }
          $sevenZFile = Get-Item "resources\python_core.7z" -ErrorAction SilentlyContinue
          if ($sevenZFile) {
            Write-Host "python_core.7z: $([math]::Round($sevenZFile.Length/1MB, 2)) MB"
          } else {
            Write-Host "No python_core.7z found"
          }
