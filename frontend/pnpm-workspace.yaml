packages:
  - locales
  - packages/*
  - components/**
  - '!**/test/**'

nodeLinker: hoisted

allowBuilds:
  '@bundled-es-modules/glob': false
  '@sentry/cli': false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: false
  style-dictionary: false
  vue-demi: false

catalog:
  '@vitejs/plugin-vue': ^6.0.3
  '@vitejs/plugin-vue-jsx': ^5.1.3
  ant-design-vue: ^4.2.6
  vue: "^3.5.24"
  vue-router: "^4.5.1"
  vite: 8.0.0-beta.10
  tailwind-merge: ^3.4.0
  tailwindcss: "^3.4.4"
  tsdown: "^0.20.1"
  lodash-es: "^4.17.21"

ignoredBuiltDependencies:
  - '@bundled-es-modules/glob'
  - '@sentry/cli'
  - core-js
  - esbuild
  - style-dictionary
  - vue-demi

onlyBuiltDependencies:
  - electron

overrides:
  shell-quote: ">=1.9.0"
  tinypool: ">=2.1.2"
  "@vitest/browser": ">=3.2.7"
  cross-spawn: ">=6.0.6"
  "brace-expansion@^1": "^1.1.20"
  "brace-expansion@^2": "^2.1.6"
  js-yaml: ">=4.3.2"
  "gray-matter>js-yaml": "^3.15.2"
  axios: ">=1.20.0"
  postcss: ">=8.5.18"
  postcss-selector-parser: ">=6.1.3"
  "nanoid@^3": "^3.3.18"
  nanoid: ">=5.1.16"
  adm-zip: ">=0.6.1"
  ws: ">=8.21.0"
  koa: ">=3.1.2"
  flatted: ">=3.4.2"
  form-data: ">=4.0.6"
  fast-uri: ">=3.1.7"
  "@xmldom/xmldom": ">=0.9.12"
  plist: ">=3.1.1"
  "@xmldom/xmldom@<0.9": ">=0.8.15"
  svgo: ">=3.3.5"
  browserslist: ">=4.28.7"
  http-cache-semantics: ">=4.3.0"
  source-map-js: ">=1.2.2"
  "@vue/server-renderer": ">=3.5.42"
  prosemirror-view: ">=1.42.3"
  linkify-it: ">=5.0.2 <6.0.0"
  tmp: ">=0.2.6"
  defu: ">=6.1.5"
  rollup: ">=4.59.0"
  picomatch: ">=4.0.4"
  "npm-run-all>minimatch": "^3.1.4"
  "sucrase>glob": ">=12.0.0"
  "test-exclude>glob": ">=12.0.0"
  "archiver-utils>glob": ">=12.0.0"
  "@lobehub/i18n-cli>glob": ">=12.0.0"


